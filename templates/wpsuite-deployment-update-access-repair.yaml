AWSTemplateFormatVersion: "2010-09-09"
Description: "WP Suite deployment update access repair (v1.1.22-dev)"
Parameters:
  TargetStackArn:
    Type: "String"
    AllowedPattern: "arn:aws:cloudformation:[a-z0-9-]+:[0-9]{12}:stack/[a-zA-Z0-9-]+/[a-f0-9-]+"
  TargetIngressRoleArn:
    Type: "String"
    AllowedPattern: "arn:aws:iam::[0-9]{12}:role/wpsuite/deployment-access/[A-Za-z0-9+=,.@_-]+"
  SellerDeployerRoleArn:
    Type: "String"
    AllowedPattern: "arn:aws:iam::637423296378:role/wpsuite-[a-z0-9-]+-marketplace-artifact-deployer"
Resources:
  RepairFunctionLogs:
    Type: "AWS::Logs::LogGroup"
    Properties:
      LogGroupName:
        Fn::Sub: "/aws/lambda/${AWS::StackName}-repair"
      RetentionInDays: 14
  RepairFunctionRole:
    Type: "AWS::IAM::Role"
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          -
            Effect: "Allow"
            Principal:
              Service: "lambda.amazonaws.com"
            Action: "sts:AssumeRole"
      Policies:
        -
          PolicyName: "RepairExistingIngressRole"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              -
                Effect: "Allow"
                Action:
                  - "cloudformation:DescribeStacks"
                  - "cloudformation:ListStackResources"
                Resource:
                  Ref: "TargetStackArn"
              -
                Effect: "Allow"
                Action:
                  - "iam:GetRole"
                  - "iam:GetRolePolicy"
                  - "iam:PutRolePolicy"
                  - "iam:DeleteRolePolicy"
                  - "iam:UpdateAssumeRolePolicy"
                Resource:
                  Ref: "TargetIngressRoleArn"
              -
                Effect: "Allow"
                Action:
                  - "logs:CreateLogStream"
                  - "logs:PutLogEvents"
                Resource:
                  Fn::GetAtt:
                    - "RepairFunctionLogs"
                    - "Arn"
  RepairFunction:
    Type: "AWS::Lambda::Function"
    Properties:
      Code:
        ZipFile: "\"\"\"CloudFormation handler for replacing the WP Suite-owned ingress policy.\"\"\"\nimport hashlib\nimport json\nimport re\n\nimport boto3\nimport cfnresponse\n\n# Replaced at synthesis with the ingress policies from the same release's root.\nPOLICIES = json.loads(\"{\\\"WriteDeploymentArtifacts\\\":[{\\\"Version\\\":\\\"2012-10-17\\\",\\\"Statement\\\":[{\\\"Effect\\\":\\\"Allow\\\",\\\"Action\\\":\\\"s3:PutObject\\\",\\\"Resource\\\":{\\\"Fn::Sub\\\":[\\\"arn:${AWS::Partition}:s3:::${Bucket}/${Prefix}*\\\",{\\\"Bucket\\\":{\\\"Ref\\\":\\\"DeploymentArtifactBucket\\\"},\\\"Prefix\\\":{\\\"Fn::Sub\\\":\\\"wpsuite-artifacts/${AWS::StackId}/\\\"}}]},\\\"Condition\\\":{\\\"StringEquals\\\":{\\\"s3:x-amz-server-side-encryption\\\":\\\"AES256\\\"}}},{\\\"Effect\\\":\\\"Allow\\\",\\\"Action\\\":\\\"s3:PutObjectTagging\\\",\\\"Resource\\\":{\\\"Fn::Sub\\\":[\\\"arn:${AWS::Partition}:s3:::${Bucket}/${Prefix}*\\\",{\\\"Bucket\\\":{\\\"Ref\\\":\\\"DeploymentArtifactBucket\\\"},\\\"Prefix\\\":{\\\"Fn::Sub\\\":\\\"wpsuite-artifacts/${AWS::StackId}/\\\"}}]}},{\\\"Effect\\\":\\\"Allow\\\",\\\"Action\\\":\\\"cloudformation:CreateChangeSet\\\",\\\"Resource\\\":{\\\"Fn::Sub\\\":\\\"arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}/*\\\"},\\\"Condition\\\":{\\\"StringLike\\\":{\\\"cloudformation:ChangeSetName\\\":\\\"wpsuite-update-*\\\",\\\"cloudformation:TemplateUrl\\\":\\\"https://wpsuite-artifacts-*-*-*.s3.*.amazonaws.com/releases/*/templates/wpsuite-deployment-orchestrator-direct.yaml\\\"}}},{\\\"Effect\\\":\\\"Allow\\\",\\\"Action\\\":[\\\"cloudformation:DescribeChangeSet\\\",\\\"cloudformation:DescribeStacks\\\",\\\"cloudformation:DescribeStackEvents\\\",\\\"cloudformation:DescribeStackResources\\\",\\\"cloudformation:GetTemplate\\\"],\\\"Resource\\\":{\\\"Fn::Sub\\\":\\\"arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}/*\\\"}},{\\\"Effect\\\":\\\"Allow\\\",\\\"Action\\\":\\\"cloudformation:DeleteChangeSet\\\",\\\"Resource\\\":{\\\"Fn::Sub\\\":\\\"arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}/*\\\"},\\\"Condition\\\":{\\\"StringLike\\\":{\\\"cloudformation:ChangeSetName\\\":\\\"wpsuite-update-*\\\"}}},{\\\"Effect\\\":\\\"Allow\\\",\\\"Action\\\":\\\"cloudformation:ValidateTemplate\\\",\\\"Resource\\\":\\\"*\\\",\\\"Condition\\\":{\\\"StringLike\\\":{\\\"cloudformation:TemplateUrl\\\":\\\"https://wpsuite-artifacts-*-*-*.s3.*.amazonaws.com/releases/*/templates/wpsuite-deployment-orchestrator-direct.yaml\\\"}}}]},{\\\"Version\\\":\\\"2012-10-17\\\",\\\"Statement\\\":[{\\\"Effect\\\":\\\"Allow\\\",\\\"Action\\\":[\\\"s3:GetObject\\\",\\\"s3:GetObjectVersion\\\"],\\\"Resource\\\":{\\\"Fn::Sub\\\":[\\\"arn:${AWS::Partition}:s3:::${Bucket}/${Prefix}change-set-templates/*/wpsuite-deployment-orchestrator-direct.yaml\\\",{\\\"Bucket\\\":{\\\"Ref\\\":\\\"DeploymentArtifactBucket\\\"},\\\"Prefix\\\":{\\\"Fn::Sub\\\":\\\"wpsuite-artifacts/${AWS::StackId}/\\\"}}]}},{\\\"Effect\\\":\\\"Allow\\\",\\\"Action\\\":\\\"cloudformation:CreateChangeSet\\\",\\\"Resource\\\":{\\\"Ref\\\":\\\"AWS::StackId\\\"},\\\"Condition\\\":{\\\"StringLike\\\":{\\\"cloudformation:ChangeSetName\\\":\\\"wpsuite-update-*\\\",\\\"cloudformation:TemplateUrl\\\":[{\\\"Fn::Sub\\\":[\\\"https://${Bucket}.s3.${AWS::Region}.${AWS::URLSuffix}/${Prefix}change-set-templates/*/wpsuite-deployment-orchestrator-direct.yaml\\\",{\\\"Bucket\\\":{\\\"Ref\\\":\\\"DeploymentArtifactBucket\\\"},\\\"Prefix\\\":{\\\"Fn::Sub\\\":\\\"wpsuite-artifacts/${AWS::StackId}/\\\"}}]},{\\\"Fn::Join\\\":[\\\"\\\",[{\\\"Fn::Sub\\\":[\\\"https://${Bucket}.s3.${AWS::Region}.${AWS::URLSuffix}/${Prefix}change-set-templates/*/wpsuite-deployment-orchestrator-direct.yaml\\\",{\\\"Bucket\\\":{\\\"Ref\\\":\\\"DeploymentArtifactBucket\\\"},\\\"Prefix\\\":{\\\"Fn::Sub\\\":\\\"wpsuite-artifacts/${AWS::StackId}/\\\"}}]},\\\"?versionId=*\\\"]]}]}}},{\\\"Effect\\\":\\\"Allow\\\",\\\"Action\\\":[\\\"cloudformation:DescribeChangeSet\\\",\\\"cloudformation:DescribeStacks\\\",\\\"cloudformation:GetStackPolicy\\\",\\\"cloudformation:GetTemplate\\\"],\\\"Resource\\\":[{\\\"Fn::Sub\\\":\\\"arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}-CognitoNestedStack-*/*\\\"},{\\\"Fn::Sub\\\":\\\"arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}-AiKitBackendNestedStack-*/*\\\"},{\\\"Fn::Sub\\\":\\\"arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}-FlowBackendNestedStack-*/*\\\"},{\\\"Fn::Sub\\\":\\\"arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}-StaticGuardianNestedStack-*/*\\\"},{\\\"Fn::Sub\\\":\\\"arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}-DrBackupNestedStack-*/*\\\"},{\\\"Fn::Sub\\\":\\\"arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}-CommerceNestedStack-*/*\\\"}]},{\\\"Effect\\\":\\\"Allow\\\",\\\"Action\\\":\\\"cloudformation:CreateChangeSet\\\",\\\"Resource\\\":[{\\\"Fn::Sub\\\":\\\"arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}-CognitoNestedStack-*/*\\\"},{\\\"Fn::Sub\\\":\\\"arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}-AiKitBackendNestedStack-*/*\\\"},{\\\"Fn::Sub\\\":\\\"arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}-FlowBackendNestedStack-*/*\\\"},{\\\"Fn::Sub\\\":\\\"arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}-StaticGuardianNestedStack-*/*\\\"},{\\\"Fn::Sub\\\":\\\"arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}-DrBackupNestedStack-*/*\\\"},{\\\"Fn::Sub\\\":\\\"arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}-CommerceNestedStack-*/*\\\"}],\\\"Condition\\\":{\\\"StringLikeIfExists\\\":{\\\"cloudformation:ChangeSetName\\\":\\\"wpsuite-update-*\\\"}}},{\\\"Effect\\\":\\\"Allow\\\",\\\"Action\\\":\\\"cloudformation:DeleteChangeSet\\\",\\\"Resource\\\":[{\\\"Fn::Sub\\\":\\\"arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}-CognitoNestedStack-*/*\\\"},{\\\"Fn::Sub\\\":\\\"arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}-AiKitBackendNestedStack-*/*\\\"},{\\\"Fn::Sub\\\":\\\"arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}-FlowBackendNestedStack-*/*\\\"},{\\\"Fn::Sub\\\":\\\"arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}-StaticGuardianNestedStack-*/*\\\"},{\\\"Fn::Sub\\\":\\\"arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}-DrBackupNestedStack-*/*\\\"},{\\\"Fn::Sub\\\":\\\"arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}-CommerceNestedStack-*/*\\\"}]},{\\\"Effect\\\":\\\"Deny\\\",\\\"Action\\\":\\\"s3:PutObject\\\",\\\"Resource\\\":{\\\"Fn::Sub\\\":[\\\"arn:${AWS::Partition}:s3:::${Bucket}/${Prefix}change-set-templates/*/wpsuite-deployment-orchestrator-direct.yaml\\\",{\\\"Bucket\\\":{\\\"Ref\\\":\\\"DeploymentArtifactBucket\\\"},\\\"Prefix\\\":{\\\"Fn::Sub\\\":\\\"wpsuite-artifacts/${AWS::StackId}/\\\"}}]},\\\"Condition\\\":{\\\"StringNotEquals\\\":{\\\"s3:if-none-match\\\":\\\"*\\\"}}}]}],\\\"ReadOwnRoleForChangeSetPreview\\\":[{\\\"Version\\\":\\\"2012-10-17\\\",\\\"Statement\\\":[{\\\"Effect\\\":\\\"Allow\\\",\\\"Action\\\":[\\\"iam:GetRole\\\",\\\"iam:ListRolePolicies\\\",\\\"iam:GetRolePolicy\\\",\\\"iam:ListAttachedRolePolicies\\\"],\\\"Resource\\\":[{\\\"Fn::GetAtt\\\":[\\\"ArtifactIngressRole\\\",\\\"Arn\\\"]},{\\\"Fn::GetAtt\\\":[\\\"ArtifactStagerFunctionRole\\\",\\\"Arn\\\"]},{\\\"Fn::GetAtt\\\":[\\\"ArtifactRetentionFunctionRole\\\",\\\"Arn\\\"]}]},{\\\"Effect\\\":\\\"Allow\\\",\\\"Action\\\":[\\\"lambda:GetFunction\\\",\\\"lambda:GetFunctionCodeSigningConfig\\\",\\\"lambda:GetFunctionRecursionConfig\\\",\\\"lambda:GetRuntimeManagementConfig\\\",\\\"lambda:GetFunctionScalingConfig\\\",\\\"lambda:GetPolicy\\\"],\\\"Resource\\\":[{\\\"Fn::GetAtt\\\":[\\\"ArtifactStagerFunction\\\",\\\"Arn\\\"]},{\\\"Fn::GetAtt\\\":[\\\"ArtifactRetentionFunction\\\",\\\"Arn\\\"]},{\\\"Fn::GetAtt\\\":[\\\"DeploymentOutputReporterFunction\\\",\\\"Arn\\\"]}]},{\\\"Effect\\\":\\\"Allow\\\",\\\"Action\\\":[\\\"cloudformation:DescribeStacks\\\",\\\"cloudformation:GetStackPolicy\\\",\\\"cloudformation:GetTemplate\\\"],\\\"Resource\\\":[{\\\"Ref\\\":\\\"AWS::StackId\\\"},{\\\"Ref\\\":\\\"CognitoNestedStack\\\"},{\\\"Ref\\\":\\\"FlowBackendNestedStack\\\"},{\\\"Ref\\\":\\\"AiKitBackendNestedStack\\\"},{\\\"Ref\\\":\\\"StaticGuardianNestedStack\\\"},{\\\"Ref\\\":\\\"DrBackupNestedStack\\\"}]},{\\\"Effect\\\":\\\"Allow\\\",\\\"Action\\\":[\\\"s3:GetAccelerateConfiguration\\\",\\\"s3:GetLifecycleConfiguration\\\",\\\"s3:GetBucketPublicAccessBlock\\\",\\\"s3:GetAnalyticsConfiguration\\\",\\\"s3:GetBucketCORS\\\",\\\"s3:GetEncryptionConfiguration\\\",\\\"s3:GetInventoryConfiguration\\\",\\\"s3:GetBucketLogging\\\",\\\"s3:GetMetricsConfiguration\\\",\\\"s3:GetBucketNotification\\\",\\\"s3:GetBucketVersioning\\\",\\\"s3:GetReplicationConfiguration\\\",\\\"s3:GetBucketWebsite\\\",\\\"s3:GetBucketObjectLockConfiguration\\\",\\\"s3:GetBucketTagging\\\",\\\"s3:ListTagsForResource\\\",\\\"s3:GetBucketAbac\\\",\\\"s3:GetBucketOwnershipControls\\\",\\\"s3:GetIntelligentTieringConfiguration\\\",\\\"s3:GetBucketMetadataTableConfiguration\\\",\\\"s3:ListBucket\\\",\\\"s3:GetBucketPolicy\\\"],\\\"Resource\\\":{\\\"Fn::GetAtt\\\":[\\\"DeploymentArtifactBucket\\\",\\\"Arn\\\"]}},{\\\"Effect\\\":\\\"Allow\\\",\\\"Action\\\":[\\\"events:DescribeRule\\\",\\\"events:ListTargetsByRule\\\",\\\"events:ListTagsForResource\\\"],\\\"Resource\\\":{\\\"Fn::Sub\\\":\\\"arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/${AWS::StackName}-artifact-gc\\\"}},{\\\"Effect\\\":\\\"Allow\\\",\\\"Action\\\":[\\\"logs:GetDataProtectionPolicy\\\",\\\"logs:ListTagsForResource\\\"],\\\"Resource\\\":[{\\\"Fn::Sub\\\":\\\"arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-artifact-gc\\\"},{\\\"Fn::Sub\\\":\\\"arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-artifact-gc:*\\\"}]},{\\\"Effect\\\":\\\"Allow\\\",\\\"Action\\\":[\\\"logs:DescribeLogGroups\\\",\\\"logs:DescribeResourcePolicies\\\",\\\"logs:DescribeIndexPolicies\\\"],\\\"Resource\\\":\\\"*\\\",\\\"Condition\\\":{\\\"StringEquals\\\":{\\\"aws:RequestedRegion\\\":{\\\"Ref\\\":\\\"AWS::Region\\\"}}}}]}]}\")\nWRITE_POLICY = \"WriteDeploymentArtifacts\"\nREAD_POLICY = \"ReadOwnRoleForChangeSetPreview\"\nSELLER_ROLE = re.compile(r\"arn:aws:iam::637423296378:role/wpsuite-[a-z0-9-]+-marketplace-artifact-deployer\")\nMISSING = object()\nVERSION = re.compile(r\"v(\\d+)\\.(\\d+)\\.(\\d+)(?:-.*)?\")\nPOLICY_REVISION = re.compile(r\"WPSuiteAccessRevisionV(\\d+)M(\\d+)P(\\d+)\")\n\n\ndef revision_core(value, pattern=VERSION):\n    match = pattern.fullmatch(value or \"\")\n    return tuple(map(int, match.groups())) if match else None\n\n\ndef resolve(value, refs, attrs):\n    if isinstance(value, list):\n        items = [resolve(item, refs, attrs) for item in value]\n        return [item for item in items if item is not MISSING]\n    if not isinstance(value, dict):\n        return value\n    if set(value) == {\"Ref\"}:\n        return refs.get(value[\"Ref\"], MISSING)\n    if set(value) == {\"Fn::GetAtt\"}:\n        return attrs.get(tuple(value[\"Fn::GetAtt\"]), MISSING)\n    if set(value) == {\"Fn::Join\"}:\n        delimiter, parts = value[\"Fn::Join\"]\n        resolved = [resolve(part, refs, attrs) for part in parts]\n        return MISSING if MISSING in resolved else delimiter.join(resolved)\n    if set(value) == {\"Fn::Sub\"}:\n        expression = value[\"Fn::Sub\"]\n        template, variables = (expression, {}) if isinstance(expression, str) else expression\n        values = refs | {name: resolve(item, refs, attrs) for name, item in variables.items()}\n        try:\n            return re.sub(r\"\\$\\{([^}]+)\\}\", lambda token: values[token[1]], template)\n        except (KeyError, TypeError):\n            return MISSING\n    if any(key.startswith(\"Fn::\") for key in value):\n        raise ValueError(\"The release contains an unsupported ingress policy expression\")\n    resolved = {key: resolve(item, refs, attrs) for key, item in value.items()}\n    return MISSING if MISSING in resolved.values() else resolved\n\n\ndef repair(properties, cfn, iam):\n    root = properties[\"TargetStackArn\"]\n    role_arn = properties[\"TargetIngressRoleArn\"]\n    seller = properties[\"SellerDeployerRoleArn\"]\n    stack_parts = root.split(\":\", 5)\n    region, account = stack_parts[3:5]\n    if not SELLER_ROLE.fullmatch(seller) or not role_arn.startswith(\n        f\"arn:aws:iam::{account}:role/wpsuite/deployment-access/\"\n    ):\n        raise ValueError(\"The expected WP Suite seller or ingress role is invalid\")\n    stack = cfn.describe_stacks(StackName=root)[\"Stacks\"][0]\n    if stack[\"StackId\"] != root or stack.get(\"ParentId\") or stack[\"StackStatus\"] not in {\n        \"CREATE_COMPLETE\", \"UPDATE_COMPLETE\", \"UPDATE_ROLLBACK_COMPLETE\"\n    }:\n        raise ValueError(\"The existing deployment must be a stable root stack\")\n    target_revision = revision_core(properties[\"PolicyRevision\"])\n    version = next((item[\"OutputValue\"] for item in stack.get(\"Outputs\", [])\n                    if item[\"OutputKey\"] == \"TemplateVersion\"), None)\n    parameters = {item[\"ParameterKey\"]: item.get(\"ParameterValue\") for item in stack.get(\"Parameters\", [])}\n    installed_revision = revision_core(version or parameters.get(\"TemplateVersion\"))\n    if not target_revision or installed_revision and installed_revision > target_revision:\n        raise ValueError(\"Use the access repair for the current deployment release\")\n    resources = {}\n    pager = cfn.get_paginator(\"list_stack_resources\")\n    for page in pager.paginate(StackName=root):\n        resources.update({item[\"LogicalResourceId\"]: item for item in page[\"StackResourceSummaries\"]})\n    role_name = role_arn.rsplit(\"/\", 1)[-1]\n    if resources.get(\"ArtifactIngressRole\", {}).get(\"PhysicalResourceId\") != role_name:\n        raise ValueError(\"The ingress role does not belong to the selected deployment\")\n    role = iam.get_role(RoleName=role_name)[\"Role\"]\n    if role[\"Arn\"] != role_arn:\n        raise ValueError(\"The deployed role ARN did not match\")\n    bucket = resources.get(\"DeploymentArtifactBucket\", {}).get(\"PhysicalResourceId\")\n    if not bucket:\n        raise ValueError(\"The deployment artifact bucket was not found\")\n\n    refs = {\n        logical: item[\"PhysicalResourceId\"] for logical, item in resources.items() if item.get(\"PhysicalResourceId\")\n    }\n    refs.update({\n        \"AWS::Partition\": \"aws\", \"AWS::Region\": region, \"AWS::AccountId\": account,\n        \"AWS::URLSuffix\": \"amazonaws.com\", \"AWS::StackId\": root, \"AWS::StackName\": stack[\"StackName\"],\n    })\n    attrs = {(\"ArtifactIngressRole\", \"Arn\"): role_arn, (\"DeploymentArtifactBucket\", \"Arn\"): f\"arn:aws:s3:::{bucket}\"}\n    for logical, item in resources.items():\n        physical = item.get(\"PhysicalResourceId\")\n        if item[\"ResourceType\"] == \"AWS::Lambda::Function\" and physical:\n            attrs[logical, \"Arn\"] = f\"arn:aws:lambda:{region}:{account}:function:{physical}\"\n        if logical in {\"ArtifactStagerFunctionRole\", \"ArtifactRetentionFunctionRole\"} and physical:\n            attrs[logical, \"Arn\"] = f\"arn:aws:iam::{account}:role/{physical}\"\n    documents = {}\n    for name, policies in POLICIES.items():\n        statements = [resolve(item, refs, attrs) for policy in policies for item in policy[\"Statement\"]]\n        statements = [item for item in statements if item is not MISSING and item.get(\"Resource\")]\n        if not statements:\n            raise ValueError(\"A required release policy could not be resolved\")\n        documents[name] = {\"Version\": \"2012-10-17\", \"Statement\": statements}\n    if not any(s[\"Action\"] == \"s3:PutObject\" for s in documents[WRITE_POLICY][\"Statement\"]):\n        raise ValueError(\"The release ingress policy could not be resolved\")\n    documents[WRITE_POLICY][\"Statement\"][0][\"Sid\"] = \"WPSuiteAccessRevisionV%dM%dP%d\" % target_revision\n\n    current_trust = role[\"AssumeRolePolicyDocument\"]\n    trust = []\n    installed = []\n    for statement in current_trust[\"Statement\"]:\n        principal = statement.get(\"Principal\", {}).get(\"AWS\", [])\n        principal = [principal] if isinstance(principal, str) else principal\n        if (statement.get(\"Effect\") == \"Allow\" and statement.get(\"Action\") == \"sts:AssumeRole\"\n                and statement.get(\"Condition\") == {\"StringEquals\": {\"sts:ExternalId\": root}}\n                and principal and all(SELLER_ROLE.fullmatch(item) for item in principal)):\n            installed.extend(principal)\n        else:\n            trust.append(statement)\n    if not installed:\n        raise ValueError(\"The existing WP Suite trust binding could not be verified\")\n    # Keep the seller used by the current root usable if the product update rolls back.\n    original_seller = parameters.get(\"WpSuiteSellerArtifactDeployerRoleArn\")\n    sellers = sorted({seller} | ({original_seller} if original_seller in installed else set()))\n    trust.append({\"Effect\": \"Allow\", \"Principal\": {\"AWS\": sellers}, \"Action\": \"sts:AssumeRole\",\n                  \"Condition\": {\"StringEquals\": {\"sts:ExternalId\": root}}})\n    updated_trust = current_trust | {\"Statement\": trust}\n    previous = {WRITE_POLICY: iam.get_role_policy(RoleName=role_name, PolicyName=WRITE_POLICY)[\"PolicyDocument\"]}\n    try:\n        previous[READ_POLICY] = iam.get_role_policy(RoleName=role_name, PolicyName=READ_POLICY)[\"PolicyDocument\"]\n    except iam.exceptions.NoSuchEntityException:\n        previous[READ_POLICY] = None\n    existing_revisions = [revision_core(item.get(\"Sid\"), POLICY_REVISION)\n                          for item in previous[WRITE_POLICY][\"Statement\"]]\n    if any(item and item > target_revision for item in existing_revisions):\n        raise ValueError(\"A newer WP Suite access policy is already installed\")\n    written = []\n    try:\n        for name, document in documents.items():\n            if document != previous[name]:\n                iam.put_role_policy(RoleName=role_name, PolicyName=name, PolicyDocument=json.dumps(document))\n                written.append(name)\n        if updated_trust != current_trust:\n            iam.update_assume_role_policy(RoleName=role_name, PolicyDocument=json.dumps(updated_trust))\n    except Exception:\n        for name in reversed(written):\n            if previous[name] is None:\n                iam.delete_role_policy(RoleName=role_name, PolicyName=name)\n            else:\n                iam.put_role_policy(RoleName=role_name, PolicyName=name, PolicyDocument=json.dumps(previous[name]))\n        raise\n\n\ndef handler(event, context):\n    properties = event[\"ResourceProperties\"]\n    immutable = (\"TargetStackArn\", \"TargetIngressRoleArn\")\n    identity = hashlib.sha256(properties[\"TargetStackArn\"].encode()).hexdigest()[:20]\n    physical_id = event.get(\"PhysicalResourceId\", \"wpsuite-update-access-\" + identity)\n    try:\n        if event[\"RequestType\"] != \"Delete\":\n            helper = event[\"StackId\"].split(\":\", 5)\n            target = properties[\"TargetStackArn\"].split(\":\", 5)\n            if helper[:5] != target[:5]:\n                raise ValueError(\"Open the repair in the deployment's account and region\")\n            old = event.get(\"OldResourceProperties\", properties)\n            if any(old[key] != properties[key] for key in immutable):\n                raise ValueError(\"The repair target cannot be changed\")\n            repair(properties, boto3.client(\"cloudformation\"), boto3.client(\"iam\"))\n        # Deleting the helper removes only its own resources. The ingress policy stays installed.\n        cfnresponse.send(event, context, cfnresponse.SUCCESS, {}, physical_id)\n    except Exception as error:\n        print(type(error).__name__, str(error))\n        cfnresponse.send(event, context, cfnresponse.FAILED, {}, physical_id)\n"
      FunctionName:
        Fn::Sub: "${AWS::StackName}-repair"
      Handler: "index.handler"
      Role:
        Fn::GetAtt:
          - "RepairFunctionRole"
          - "Arn"
      Runtime: "python3.12"
      Timeout: 45
  RepairAccess:
    Type: "Custom::WPSuiteUpdateAccessRepair"
    Properties:
      ServiceToken:
        Fn::GetAtt:
          - "RepairFunction"
          - "Arn"
      ServiceTimeout: 60
      TargetStackArn:
        Ref: "TargetStackArn"
      TargetIngressRoleArn:
        Ref: "TargetIngressRoleArn"
      SellerDeployerRoleArn:
        Ref: "SellerDeployerRoleArn"
      PolicyRevision: "v1.1.22-dev"
Outputs:
  RepairedStack:
    Value:
      Ref: "TargetStackArn"
  PolicyRevision:
    Value: "v1.1.22-dev"
