Resources:
  DeploymentArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - ExpirationInDays: 30
            Id: ExpireCleanupEligibleArtifacts
            Status: Enabled
            TagFilters:
              - Key: wpsuite-artifact-retention
                Value: cleanup-eligible
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: aws-apn-id
          Value: pc:5d8wq5hg1d54kb933ntenntiu
  DeploymentArtifactBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket:
        Ref: DeploymentArtifactBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - Fn::Sub:
                  - arn:${AWS::Partition}:s3:::${Bucket}
                  - Bucket:
                      Ref: DeploymentArtifactBucket
              - Fn::Sub:
                  - arn:${AWS::Partition}:s3:::${Bucket}/*
                  - Bucket:
                      Ref: DeploymentArtifactBucket
            Condition:
              Bool:
                aws:SecureTransport: 'false'
  ArtifactIngressRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS:
                Ref: WpSuiteSellerArtifactDeployerRoleArn
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId:
                  Ref: AWS::StackId
      Description: Allows the WP Suite Marketplace backend to stage authorized runtime artifacts into this stack bucket.
      Path: /wpsuite/deployment-access/
      Policies:
        - PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:PutObject
                Resource:
                  Fn::Sub:
                    - arn:${AWS::Partition}:s3:::${Bucket}/${Prefix}*
                    - Bucket:
                        Ref: DeploymentArtifactBucket
                      Prefix:
                        Fn::Sub: wpsuite-artifacts/${AWS::StackId}/
                Condition:
                  StringEquals:
                    s3:x-amz-server-side-encryption: AES256
              - Effect: Allow
                Action: s3:PutObjectTagging
                Resource:
                  Fn::Sub:
                    - arn:${AWS::Partition}:s3:::${Bucket}/${Prefix}*
                    - Bucket:
                        Ref: DeploymentArtifactBucket
                      Prefix:
                        Fn::Sub: wpsuite-artifacts/${AWS::StackId}/
              - Effect: Allow
                Action: cloudformation:CreateChangeSet
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}/*
                Condition:
                  StringLike:
                    cloudformation:ChangeSetName: wpsuite-update-*
                    cloudformation:TemplateUrl: https://wpsuite-artifacts-*-*-*.s3.*.amazonaws.com/releases/*/templates/wpsuite-deployment-orchestrator-direct.yaml
              - Effect: Allow
                Action:
                  - cloudformation:DescribeChangeSet
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResources
                  - cloudformation:GetTemplate
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}/*
              - Effect: Allow
                Action: cloudformation:DeleteChangeSet
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}/*
                Condition:
                  StringLike:
                    cloudformation:ChangeSetName: wpsuite-update-*
              - Effect: Allow
                Action: cloudformation:ValidateTemplate
                Resource: '*'
                Condition:
                  StringLike:
                    cloudformation:TemplateUrl: https://wpsuite-artifacts-*-*-*.s3.*.amazonaws.com/releases/*/templates/wpsuite-deployment-orchestrator-direct.yaml
          PolicyName: WriteDeploymentArtifacts
      Tags:
        - Key: aws-apn-id
          Value: pc:5d8wq5hg1d54kb933ntenntiu
        - Key: WPSuitePurpose
          Value: deployment-artifact-ingress
  ArtifactStagerFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:PutRetentionPolicy
                Resource: '*'
          PolicyName: ArtifactStagerLogs
        - PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:ListBucketVersions
                  - s3:ListBucketMultipartUploads
                Resource:
                  Fn::Sub:
                    - arn:${AWS::Partition}:s3:::${Bucket}
                    - Bucket:
                        Ref: DeploymentArtifactBucket
              - Effect: Allow
                Action:
                  - s3:DeleteObject
                  - s3:DeleteObjectVersion
                  - s3:AbortMultipartUpload
                Resource:
                  Fn::Sub:
                    - arn:${AWS::Partition}:s3:::${Bucket}/*
                    - Bucket:
                        Ref: DeploymentArtifactBucket
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:GetObjectTagging
                  - s3:PutObjectTagging
                Resource:
                  Fn::Sub:
                    - arn:${AWS::Partition}:s3:::${Bucket}/${Prefix}*
                    - Bucket:
                        Ref: DeploymentArtifactBucket
                      Prefix:
                        Fn::Sub: wpsuite-artifacts/${AWS::StackId}/
          PolicyName: CleanDeploymentArtifactBucket
      Tags:
        - Key: aws-apn-id
          Value: pc:5d8wq5hg1d54kb933ntenntiu
  ArtifactStagerReadDeploymentSecretPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
            Resource:
              Ref: WpSuiteDeploymentSecretArn
      PolicyName: ReadDeploymentSecret
      Roles:
        - Ref: ArtifactStagerFunctionRole
    Condition: CondUseMarketplaceSecret
  ArtifactStagerFunction:
    Type: AWS::Lambda::Function
    Properties:
      Code:
        ZipFile: |

          const https = require("https");
          const url = require("url");
          const { SecretsManagerClient, GetSecretValueCommand } = require("@aws-sdk/client-secrets-manager");
          const { CloudWatchLogsClient, PutRetentionPolicyCommand } = require("@aws-sdk/client-cloudwatch-logs");
          const {
            S3Client,
            AbortMultipartUploadCommand,
            CopyObjectCommand,
            DeleteObjectsCommand,
            GetObjectCommand,
            GetObjectTaggingCommand,
            ListMultipartUploadsCommand,
            ListObjectVersionsCommand,
            ListObjectsV2Command,
            PutObjectTaggingCommand,
            PutObjectCommand
          } = require("@aws-sdk/client-s3");

          const logs = new CloudWatchLogsClient({});
          const s3 = new S3Client({});

          function logInfo(message, data) {
            console.info(JSON.stringify({ level: "INFO", message, data: data || {} }));
          }

          function logWarn(message, data) {
            console.warn(JSON.stringify({ level: "WARN", message, data: data || {} }));
          }

          function logError(message, error, data) {
            console.error(JSON.stringify({
              level: "ERROR",
              message,
              data: data || {},
              error: {
                name: error && error.name,
                message: error && error.message ? error.message : String(error),
                stack: error && error.stack
              }
            }));
          }

          async function configureLogRetention(retentionValue) {
            const retentionInDays = Number(retentionValue || "");
            if (!Number.isInteger(retentionInDays) || retentionInDays <= 0) {
              if (retentionValue) {
                logWarn("Skipping invalid ArtifactStager log retention value", { retentionValue });
              }
              return;
            }
            const functionName = process.env.AWS_LAMBDA_FUNCTION_NAME;
            if (!functionName) {
              logWarn("Skipping ArtifactStager log retention because function name is unavailable");
              return;
            }
            const logGroupName = "/aws/lambda/" + functionName;
            try {
              await logs.send(new PutRetentionPolicyCommand({ logGroupName, retentionInDays }));
              logInfo("ArtifactStager log retention configured", { logGroupName, retentionInDays });
            } catch (error) {
              logWarn("ArtifactStager log retention could not be configured", {
                logGroupName,
                retentionInDays,
                errorName: error && error.name,
                errorMessage: error && error.message ? error.message : String(error)
              });
            }
          }

          function requestJson(endpoint, body, timeoutMs = 20000) {
            return new Promise((resolve, reject) => {
              const parsed = new url.URL(endpoint);
              const payload = JSON.stringify(body);
              const req = https.request({
                hostname: parsed.hostname,
                path: parsed.pathname + parsed.search,
                method: "POST",
                headers: {
                  "content-type": "application/json",
                  "content-length": Buffer.byteLength(payload)
                }
              }, (res) => {
                let data = "";
                res.on("data", (chunk) => { data += chunk; });
                res.on("end", () => {
                  if (res.statusCode < 200 || res.statusCode >= 300) {
                    let backendCode = "";
                    let backendRequestId = "";
                    try {
                      const errorBody = JSON.parse(data);
                      if (/^[A-Z][A-Z0-9_]{0,79}$/.test(errorBody.code)) backendCode = errorBody.code;
                      if (/^[a-f0-9-]{36}$/i.test(errorBody.requestId)) backendRequestId = errorBody.requestId;
                    } catch (_) { /* Error bodies may be plain text; never log them. */ }
                    const failure = new Error("WP Suite backend returned " + res.statusCode +
                      (backendCode ? " (" + backendCode + ")" : "") +
                      (backendRequestId ? " requestId=" + backendRequestId : ""));
                    failure.statusCode = res.statusCode;
                    reject(failure);
                    return;
                  }
                  try {
                    resolve(data ? JSON.parse(data) : {});
                  } catch (_) {
                    reject(new Error("WP Suite backend returned an invalid staging response"));
                  }
                });
                res.on("error", reject);
              });
              req.on("error", reject);
              if (typeof req.setTimeout === "function") {
                req.setTimeout(timeoutMs, () => {
                  const failure = new Error("WP Suite staging HTTP request timed out");
                  failure.code = "STAGING_HTTP_TIMEOUT";
                  req.destroy(failure);
                });
              }
              req.write(payload);
              req.end();
            });
          }

          async function waitForArtifactStaging(endpoint, input, context) {
            // The copy worker has five minutes; leave room for dispatch and status delivery.
            const remaining = typeof context.getRemainingTimeInMillis === "function"
              ? context.getRemainingTimeInMillis() - 60000 : 360000;
            const deadline = Date.now() + Math.min(360000, remaining);
            let stagingJobId;
            let transientFailures = 0;
            while (Date.now() < deadline) {
              let response;
              try {
                response = await requestJson(endpoint, {
                  ...input,
                  async: true,
                  ...(stagingJobId ? { stagingJobId } : {})
                }, Math.min(20000, Math.max(1, deadline - Date.now())));
                transientFailures = 0;
              } catch (error) {
                const transient = error.code === "STAGING_HTTP_TIMEOUT" ||
                  ["ECONNRESET", "ETIMEDOUT", "EPIPE"].includes(error.code) ||
                  [502, 503, 504].includes(error.statusCode);
                // Repeating the same authenticated CFN request joins its durable job.
                if (!transient) throw error;
                transientFailures += 1;
                await new Promise(resolve => setTimeout(resolve,
                  Math.min(5000, transientFailures * 2000, Math.max(0, deadline - Date.now()))));
                continue;
              }
              if (!["pending", "running"].includes(response.status)) return response;
              if (!/^stagingjob_[a-f0-9]{64}$/.test(response.stagingJobId || "") ||
                  (stagingJobId && response.stagingJobId !== stagingJobId)) {
                throw new Error("WP Suite backend returned an invalid staging job identity");
              }
              stagingJobId = response.stagingJobId;
              await new Promise(resolve => setTimeout(resolve, Math.min(2000, Math.max(0, deadline - Date.now()))));
            }
            throw new Error("WP Suite artifact staging did not finish within six minutes");
          }

          function sendResponse(event, context, status, data, physicalResourceId, reason) {
            return new Promise((resolve, reject) => {
              const body = JSON.stringify({
                Status: status,
                Reason: reason || ("See CloudWatch Log Stream: " + context.logStreamName),
                PhysicalResourceId: physicalResourceId || context.logStreamName,
                StackId: event.StackId,
                RequestId: event.RequestId,
                LogicalResourceId: event.LogicalResourceId,
                NoEcho: false,
                Data: data || {}
              });
              const parsed = new url.URL(event.ResponseURL);
              const req = https.request({
                hostname: parsed.hostname,
                path: parsed.pathname + parsed.search,
                method: "PUT",
                headers: {
                  "content-type": "",
                  "content-length": Buffer.byteLength(body)
                }
              }, (res) => {
                res.resume();
                res.on("end", resolve);
              });
              req.on("error", reject);
              req.write(body);
              req.end();
            });
          }

          async function deploymentContext(props) {
            if (props.DeploymentContextMode === "direct") {
              if (!props.DeploymentId || !props.DeploymentNonce) {
                throw new Error("Direct WP Suite deployment context is incomplete");
              }
              return {
                deploymentId: props.DeploymentId,
                nonce: props.DeploymentNonce,
                expectedAwsAccountId: props.ExpectedAwsAccountId || ""
              };
            }

            if (!props.DeploymentSecretArn) {
              throw new Error("WP Suite deployment secret ARN is missing");
            }

            const secrets = new SecretsManagerClient({});
            const secret = await secrets.send(new GetSecretValueCommand({
              SecretId: props.DeploymentSecretArn
            }));
            if (!secret.SecretString) {
              throw new Error("WP Suite deployment secret is empty");
            }

            const parsed = JSON.parse(secret.SecretString);
            if (!parsed.deploymentId || !parsed.nonce) {
              throw new Error("WP Suite deployment secret is missing required fields");
            }
            return parsed;
          }

          async function deleteObjects(bucketName, objects) {
            if (!objects.length) {
              return 0;
            }

            let deleted = 0;
            for (let index = 0; index < objects.length; index += 1000) {
              const batch = objects.slice(index, index + 1000);
              await s3.send(new DeleteObjectsCommand({
                Bucket: bucketName,
                Delete: {
                  Objects: batch,
                  Quiet: true
                }
              }));
              deleted += batch.length;
            }
            return deleted;
          }

          async function emptyBucket(bucketName) {
            if (!bucketName) {
              logWarn("Skipping artifact bucket cleanup because bucket name is missing");
              return;
            }

            try {
              logInfo("ArtifactStager bucket cleanup started", { bucketName });
              let deletedObjects = 0;
              let abortedUploads = 0;

              let continuationToken;
              do {
                const response = await s3.send(new ListObjectsV2Command({
                  Bucket: bucketName,
                  ContinuationToken: continuationToken
                }));
                const objects = (response.Contents || [])
                  .filter((object) => object.Key)
                  .map((object) => ({ Key: object.Key }));
                deletedObjects += await deleteObjects(bucketName, objects);
                continuationToken = response.NextContinuationToken;
              } while (continuationToken);

              let keyMarker;
              let versionIdMarker;
              do {
                const response = await s3.send(new ListObjectVersionsCommand({
                  Bucket: bucketName,
                  KeyMarker: keyMarker,
                  VersionIdMarker: versionIdMarker
                }));
                const versions = [
                  ...(response.Versions || []),
                  ...(response.DeleteMarkers || [])
                ]
                  .filter((object) => object.Key)
                  .map((object) => ({ Key: object.Key, VersionId: object.VersionId }));
                deletedObjects += await deleteObjects(bucketName, versions);
                keyMarker = response.NextKeyMarker;
                versionIdMarker = response.NextVersionIdMarker;
              } while (keyMarker);

              let uploadKeyMarker;
              let uploadIdMarker;
              do {
                const response = await s3.send(new ListMultipartUploadsCommand({
                  Bucket: bucketName,
                  KeyMarker: uploadKeyMarker,
                  UploadIdMarker: uploadIdMarker
                }));
                for (const upload of response.Uploads || []) {
                  if (!upload.Key || !upload.UploadId) {
                    continue;
                  }
                  await s3.send(new AbortMultipartUploadCommand({
                    Bucket: bucketName,
                    Key: upload.Key,
                    UploadId: upload.UploadId
                  }));
                  abortedUploads += 1;
                }
                uploadKeyMarker = response.NextKeyMarker;
                uploadIdMarker = response.NextUploadIdMarker;
              } while (uploadKeyMarker);

              logInfo("ArtifactStager bucket cleanup completed", {
                bucketName,
                deletedObjects,
                abortedUploads
              });
            } catch (error) {
              if (error && error.name === "NoSuchBucket") {
                logWarn("ArtifactStager bucket cleanup skipped because bucket no longer exists", { bucketName });
                return;
              }
              throw error;
            }
          }


          const RETENTION_CONTROL = "_retention/";
          const RETENTION_PARALLELISM = 6;

          function retentionControlKey(stackPrefix, name) {
            validateStackPrefix(stackPrefix);
            // Legacy helpers scan and lifecycle-tag every object under wpsuite-artifacts.
            // Keep durable fences outside that namespace, including during rollback.
            return stackPrefix.replace(/^wpsuite-artifacts\//, "wpsuite-retention/") + name;
          }

          function validateStackPrefix(prefix) {
            if (typeof prefix !== "string" || !prefix.startsWith("wpsuite-artifacts/") ||
                !prefix.endsWith("/") || prefix.includes("..")) throw new Error("Invalid retention namespace");
            return prefix;
          }

          function validateArtifactPrefix(prefix, stackPrefix, label) {
            validateStackPrefix(stackPrefix);
            if (typeof prefix !== "string" || !prefix.endsWith("/") || prefix.includes("..") ||
                !prefix.startsWith(stackPrefix) || prefix === stackPrefix ||
                prefix.startsWith(stackPrefix + RETENTION_CONTROL)) {
              throw new Error(label + " is outside the deployment artifact namespace");
            }
            return prefix;
          }

          function isMissing(error) {
            return ["NoSuchKey", "NotFound"].includes(error && error.name) ||
              (error && error.$metadata && error.$metadata.httpStatusCode === 404);
          }
          function isConditionalConflict(error) {
            return ["PreconditionFailed", "ConditionalRequestConflict"].includes(error && error.name) ||
              (error && error.$metadata && [409, 412].includes(error.$metadata.httpStatusCode));
          }

          async function readRetentionJson(bucket, key, abortSignal) {
            try {
              const response = await s3.send(new GetObjectCommand({ Bucket: bucket, Key: key }), { abortSignal });
              if (!response.ETag || !response.Body) throw new Error("Incomplete retention control object");
              const raw = await response.Body.transformToString();
              if (Buffer.byteLength(raw) > 1048576) throw new Error("Retention control object exceeds limit");
              return { value: JSON.parse(raw), etag: response.ETag };
            } catch (error) { if (isMissing(error)) return null; throw error; }
          }

          async function writeRetentionJson(bucket, key, value, condition, abortSignal) {
            // Every control revision has a distinct ETag, even if its logical state is
            // unchanged. A delayed conditional write must never pass an ABA comparison.
            const body = JSON.stringify({ ...value, writeRevision: require("crypto").randomUUID() });
            if (Buffer.byteLength(body) > 1048576) throw new Error("Retention control object exceeds limit");
            const result = await s3.send(new PutObjectCommand({ Bucket: bucket, Key: key,
              Body: body, ContentType: "application/json", ServerSideEncryption: "AES256", ...condition }), { abortSignal });
            if (!result.ETag) throw new Error("Missing conditional-write ETag");
            return result.ETag;
          }

          async function acquireRetentionLease(bucket, stackPrefix, context, wait, abortSignal) {
            validateStackPrefix(stackPrefix);
            const key = retentionControlKey(stackPrefix, "lease.json");
            const remaining = () => typeof context.getRemainingTimeInMillis === "function"
              ? context.getRemainingTimeInMillis() : 900000;
            const deadline = Date.now() + Math.max(0, remaining() - 60000);
            const holder = require("crypto").randomUUID();
            do {
              const current = await readRetentionJson(bucket, key, abortSignal);
              if (current && (!Number.isSafeInteger(current.value.expiresAt) || typeof current.value.holder !== "string")) {
                throw new Error("Invalid retention lease");
              }
              if (!current || current.value.expiresAt <= Date.now()) {
                // A crashed holder cannot still be running when this lease expires:
                // its actual Lambda hard deadline plus a thirty-second safety margin.
                const value = { holder, expiresAt: Date.now() + remaining() + 30000 };
                try {
                  const etag = await writeRetentionJson(bucket, key, value,
                    current ? { IfMatch: current.etag } : { IfNoneMatch: "*" }, abortSignal);
                  return { bucket, key, etag, holder, expiresAt: value.expiresAt, abortSignal };
                } catch (error) { if (!isConditionalConflict(error)) throw error; }
              }
              if (!wait) return null;
              await new Promise(resolve => setTimeout(resolve, 500));
            } while (Date.now() < deadline);
            throw new Error("Artifact retention is busy; retry the stack operation");
          }

          async function assertRetentionLease(lease) {
            if (Date.now() >= lease.expiresAt - 10000) throw new Error("Retention lease deadline reached");
            const current = await readRetentionJson(lease.bucket, lease.key, lease.abortSignal);
            if (!current || current.etag !== lease.etag || current.value.holder !== lease.holder) {
              throw new Error("Retention lease changed");
            }
          }

          async function releaseRetentionLease(lease) {
            // Conditional tombstone avoids relying on newer DeleteObject IfMatch support.
            await writeRetentionJson(lease.bucket, lease.key, { holder: "", expiresAt: 0 },
              { IfMatch: lease.etag }, AbortSignal.timeout(5000));
          }

          async function retentionPool(items, operation) {
            let index = 0;
            let failure;
            await Promise.all(Array.from({ length: Math.min(RETENTION_PARALLELISM, items.length) }, async () => {
              while (!failure && index < items.length) {
                const item = items[index++];
                try { await operation(item); } catch (error) { failure = failure || error; }
              }
            }));
            // All started S3 requests have settled before releasing the shared lease.
            if (failure) throw failure;
          }

          async function setArtifactRetention(bucketName, key, retention, lease) {
            const current = await s3.send(new GetObjectTaggingCommand({ Bucket: bucketName, Key: key }), { abortSignal: lease.abortSignal });
            if ((current.TagSet || []).some(tag => tag.Key === "wpsuite-artifact-retention" && tag.Value === retention)) return;
            const tagSet = (current.TagSet || []).filter(tag => tag.Key !== "wpsuite-artifact-retention");
            tagSet.push({ Key: "wpsuite-artifact-retention", Value: retention });
            await assertRetentionLease(lease);
            if (lease.beforeMutation) await lease.beforeMutation();
            if (retention === "cleanup-eligible") {
              // Start the thirty-day grace period at first demotion, not at original upload.
              await s3.send(new CopyObjectCommand({ Bucket: bucketName, Key: key,
                CopySource: encodeURIComponent(bucketName + "/" + key).replace(/%2F/g, "/"),
                MetadataDirective: "COPY", TaggingDirective: "REPLACE",
                Tagging: tagSet.map(tag => encodeURIComponent(tag.Key) + "=" + encodeURIComponent(tag.Value)).join("&") }), { abortSignal: lease.abortSignal });
            } else {
              await s3.send(new PutObjectTaggingCommand({ Bucket: bucketName, Key: key, Tagging: { TagSet: tagSet } }), { abortSignal: lease.abortSignal });
            }
          }

          function validateRetentionState(state, stackPrefix) {
            if (!state || state.schemaVersion !== 1 || !Array.isArray(state.protectedPrefixes) ||
                state.protectedPrefixes.length < 1 || state.protectedPrefixes.length > 2 ||
                !Array.isArray(state.completedPrefixes) || state.completedPrefixes.length > 10000) {
              throw new Error("Invalid retention state");
            }
            for (const prefix of [...state.protectedPrefixes, ...state.completedPrefixes]) validateArtifactPrefix(prefix, stackPrefix, "Retention prefix");
            if (state.quarantinedPrefixes !== undefined && (!Array.isArray(state.quarantinedPrefixes) || state.quarantinedPrefixes.length > 10000)) {
              throw new Error("Invalid retention quarantine");
            }
            for (const prefix of state.quarantinedPrefixes || []) validateArtifactPrefix(prefix, stackPrefix, "Quarantined prefix");
            if (state.pending) {
              validateArtifactPrefix(state.pending.prefix, stackPrefix, "Pending prefix");
              if (state.pending.token !== undefined && (typeof state.pending.token !== "string" || state.pending.token.length > 16384)) throw new Error("Invalid retention cursor");
            }
            return state;
          }

          function assertNoQuarantinedGeneration(state, prefixes) {
            const quarantined = new Set(state.quarantinedPrefixes || []);
            const requested = [...prefixes];
            if (prefixes.length === 1 && state.protectedPrefixes[0] === prefixes[0] && state.protectedPrefixes[1]) requested.push(state.protectedPrefixes[1]);
            if (requested.some(prefix => quarantined.has(prefix))) {
              throw new Error("ARTIFACT_GENERATION_QUARANTINED: a previous cleanup write has an uncertain outcome; use a different release generation");
            }
          }

          async function assertArtifactGenerationsAvailable(bucket, stackPrefix, prefixes) {
            const targets = prefixes.map(prefix => validateArtifactPrefix(prefix, stackPrefix, "Requested prefix"));
            const stored = await readRetentionJson(bucket, retentionControlKey(stackPrefix, "state.json"));
            if (stored) assertNoQuarantinedGeneration(validateRetentionState(stored.value, stackPrefix), targets);
          }

          async function protectArtifactGenerations(bucket, stackPrefix, prefixes, lease) {
            const protectedPrefixes = [...new Set(prefixes.map(prefix => validateArtifactPrefix(prefix, stackPrefix, "Protected prefix")))];
            if (protectedPrefixes.length < 1 || protectedPrefixes.length > 2) throw new Error("Invalid protected generation count");
            const key = retentionControlKey(stackPrefix, "state.json");
            const stored = await readRetentionJson(bucket, key);
            const previous = stored ? validateRetentionState(stored.value, stackPrefix) : { completedPrefixes: [] };
            if (stored) assertNoQuarantinedGeneration(previous, protectedPrefixes);
            // A configuration-only update does not replace the previous distinct release.
            if (protectedPrefixes.length === 1 && previous.protectedPrefixes &&
                previous.protectedPrefixes[0] === protectedPrefixes[0] && previous.protectedPrefixes[1]) {
              protectedPrefixes.push(previous.protectedPrefixes[1]);
            }
            for (const prefix of protectedPrefixes) {
              let token;
              do {
                const page = await s3.send(new ListObjectsV2Command({ Bucket: bucket, Prefix: prefix, ContinuationToken: token }));
                await retentionPool((page.Contents || []).filter(object => object.Key).map(object => object.Key),
                  key => setArtifactRetention(bucket, key, "protected", lease));
                token = page.NextContinuationToken;
              } while (token);
            }
            await assertRetentionLease(lease);
            const state = { schemaVersion: 1, protectedPrefixes,
              completedPrefixes: previous.completedPrefixes.filter(prefix => !protectedPrefixes.includes(prefix)),
              quarantinedPrefixes: previous.quarantinedPrefixes || [] };
            await writeRetentionJson(bucket, key, state, stored ? { IfMatch: stored.etag } : { IfNoneMatch: "*" });
            logInfo("Current and previous artifact generations protected", { protectedPrefixes });
          }

          async function maintainArtifactRetention(bucket, stackPrefix, context) {
            const controller = new AbortController();
            const remaining = typeof context.getRemainingTimeInMillis === "function" ? context.getRemainingTimeInMillis() : 60000;
            const budget = Math.min(10000, remaining - 15000);
            if (budget <= 0) return;
            const timer = setTimeout(() => controller.abort(), budget);
            let lease;
            try {
              lease = await acquireRetentionLease(bucket, stackPrefix, context, false, controller.signal);
              if (!lease) { logInfo("Artifact retention deferred while staging is active"); return; }
              const stateKey = retentionControlKey(stackPrefix, "state.json");
              const stored = await readRetentionJson(bucket, stateKey, controller.signal);
              if (!stored) return;
              const state = validateRetentionState(stored.value, stackPrefix);
              const protectedSet = new Set(state.protectedPrefixes);
              const completedSet = new Set(state.completedPrefixes);
              const quarantinedSet = new Set(state.quarantinedPrefixes || []);
              let prefix = state.pending && !protectedSet.has(state.pending.prefix) && !quarantinedSet.has(state.pending.prefix) ? state.pending.prefix : null;
              let token = prefix ? state.pending.token : undefined;
              if (!prefix) {
                let discoveryToken;
                do {
                  const page = await s3.send(new ListObjectsV2Command({ Bucket: bucket, Prefix: stackPrefix,
                    Delimiter: "/", MaxKeys: 1000, ContinuationToken: discoveryToken }), { abortSignal: controller.signal });
                  const candidate = (page.CommonPrefixes || []).map(item => item.Prefix)
                    .find(item => item && item !== stackPrefix + RETENTION_CONTROL && !protectedSet.has(item) && !completedSet.has(item) && !quarantinedSet.has(item));
                  if (candidate) { prefix = validateArtifactPrefix(candidate, stackPrefix, "Discovered prefix"); break; }
                  discoveryToken = page.NextContinuationToken;
                } while (discoveryToken);
              }
              if (!prefix) return;
              const page = await s3.send(new ListObjectsV2Command({ Bucket: bucket, Prefix: prefix,
                MaxKeys: 24, ContinuationToken: token }), { abortSignal: controller.signal });
              const keys = (page.Contents || []).filter(object => object.Key).map(object => {
                if (!object.Key.startsWith(prefix)) throw new Error("Object outside retention generation");
                return object.Key;
              });
              let intent;
              lease.beforeMutation = () => {
                if (!intent) intent = (async () => {
                  // The acknowledged intent is the fence, not the client's RPC lifetime.
                  // A lost response can leave a server-side write running after abort.
                  state.quarantinedPrefixes = [...new Set([...(state.quarantinedPrefixes || []), prefix])];
                  stored.etag = await writeRetentionJson(bucket, stateKey, state, { IfMatch: stored.etag }, controller.signal);
                })();
                return intent;
              };
              await retentionPool(keys, key => setArtifactRetention(bucket, key, "cleanup-eligible", lease));
              await assertRetentionLease(lease);
              // Only successful, non-retried mutation responses permit removing the fence.
              // On any uncertain result it remains indefinitely, blocking re-promotion.
              if (intent) state.quarantinedPrefixes = state.quarantinedPrefixes.filter(value => value !== prefix);
              if (page.NextContinuationToken) state.pending = { prefix, token: page.NextContinuationToken };
              else {
                completedSet.add(prefix);
                state.completedPrefixes = [...completedSet];
                delete state.pending;
              }
              await writeRetentionJson(bucket, stateKey, state, { IfMatch: stored.etag }, controller.signal);
              logInfo("Artifact retention background page completed", { prefix, objects: keys.length, complete: !page.NextContinuationToken });
            } catch (error) {
              if (!controller.signal.aborted) throw error;
              logInfo("Artifact retention page deferred at its time budget");
            } finally {
              clearTimeout(timer);
              if (lease) await releaseRetentionLease(lease);
            }
          }


          exports.handler = async (event, context) => {
            const physicalResourceId = event.PhysicalResourceId || "wpsuite-artifact-stager";
            const props = event.ResourceProperties || {};
            let retentionLease;
            logInfo("ArtifactStager request received", {
              requestType: event.RequestType,
              logicalResourceId: event.LogicalResourceId,
              physicalResourceId,
              stackId: event.StackId,
              hasDeploymentSecretArn: Boolean(props.DeploymentSecretArn),
              deploymentContextMode: props.DeploymentContextMode,
              targetBucketName: props.TargetBucketName,
              targetPrefix: props.TargetPrefix
            });
            try {
              await configureLogRetention(props.LogRetentionDays);
              retentionLease = await acquireRetentionLease(props.TargetBucketName, props.StackArtifactPrefix, context, true);

              if (event.RequestType === "Delete") {
                await emptyBucket(props.TargetBucketName);
                // The bucket drain also removed the lease. Never recreate it after deletion.
                retentionLease = undefined;
                logInfo("ArtifactStager delete request acknowledged", { physicalResourceId });
                await sendResponse(event, context, "SUCCESS", {}, physicalResourceId);
                return;
              }

              const previousProps = event.OldResourceProperties || {};
              const previousStagingPrefix = event.RequestType === "Update" &&
                previousProps.TargetPrefix !== props.TargetPrefix
                ? previousProps.TargetPrefix || ""
                : "";
              await assertArtifactGenerationsAvailable(props.TargetBucketName, props.StackArtifactPrefix,
                [props.TargetPrefix, ...(previousStagingPrefix ? [previousStagingPrefix] : [])]);

              const deployment = await deploymentContext(props);
              logInfo("ArtifactStager deployment context resolved", {
                deploymentId: deployment.deploymentId,
                expectedAwsAccountId: deployment.expectedAwsAccountId || "",
                templateVersion: deployment.templateVersion || props.TemplateVersion,
                hasTopology: Boolean(deployment.topology || props.Topology)
              });
              const currentAwsAccountId = context.invokedFunctionArn.split(":")[4];
              const templateVersion = deployment.templateVersion || props.TemplateVersion;
              const topology = deployment.topology || props.Topology || {};
              const previousTemplateVersion = previousStagingPrefix
                ? previousProps.TemplateVersion || ""
                : "";
              logInfo("ArtifactStager calling WP Suite backend", {
                endpoint: props.BackendStageArtifactUrl,
                deploymentId: deployment.deploymentId,
                templateVersion,
                targetBucketName: props.TargetBucketName,
                targetPrefix: props.TargetPrefix
              });
              const response = await waitForArtifactStaging(props.BackendStageArtifactUrl, {
                requestType: event.RequestType,
                stackId: event.StackId,
                requestId: event.RequestId,
                deploymentId: deployment.deploymentId,
                nonce: deployment.nonce,
                awsAccountId: deployment.expectedAwsAccountId || currentAwsAccountId,
                templateVersion,
                topology,
                stagingBucket: props.TargetBucketName,
                stagingPrefix: props.TargetPrefix,
                previousStagingPrefix,
                previousTemplateVersion,
                targetBucketName: props.TargetBucketName,
                targetPrefix: props.TargetPrefix,
                artifactIngressRoleArn: props.ArtifactIngressRoleArn,
                artifactIngressExternalId: props.ArtifactIngressExternalId,
                region: process.env.AWS_REGION
              }, context);
              const resolvedNameBudgets = {
                CognitoAppName: 43,
                AiKitAppName: 37,
                FlowAppName: 35,
                StaticGuardianAppName: 45,
                DrBackupAppName: 40,
                SharedApiResourcePrefix: 104
              };
              const resolvedNames = {};
              for (const [key, maxLength] of Object.entries(resolvedNameBudgets)) {
                const value = response[key];
                const valid = typeof value === "string" && value.length > 0 &&
                  value.length <= maxLength && !/[^A-Za-z0-9-]/.test(value);
                if (props.RequireResolvedAppNames === "true" && !valid) {
                  throw new Error("WP Suite backend did not return a valid resolved resource name (" + key + ")");
                }
                if (valid) resolvedNames[key] = value;
              }
              if (response.IntegrationEventContractVersion !== "1") {
                throw new Error("WP Suite backend integration event contract version is missing or unsupported");
              }
              const integrationEventBusName = response.IntegrationEventBusName === undefined
                ? "default"
                : response.IntegrationEventBusName;
              if (typeof integrationEventBusName !== "string" || !/^[A-Za-z0-9._-]{1,256}$/.test(integrationEventBusName)) {
                throw new Error("WP Suite backend returned an invalid integration event bus name");
              }
              const integrationEventConsumersEnabled = response.IntegrationEventConsumersEnabled === undefined
                ? (integrationEventBusName === "default" ? "true" : "false")
                : response.IntegrationEventConsumersEnabled;
              if (integrationEventConsumersEnabled !== "true" && integrationEventConsumersEnabled !== "false") {
                throw new Error("WP Suite backend returned an invalid integration event consumer state");
              }
              const protectedPrefixes = [props.TargetPrefix];
              if (previousStagingPrefix && previousStagingPrefix !== props.TargetPrefix) {
                protectedPrefixes.push(previousStagingPrefix);
              }
              await protectArtifactGenerations(
                props.TargetBucketName,
                props.StackArtifactPrefix,
                protectedPrefixes,
                retentionLease
              );
              logInfo("ArtifactStager backend call completed", {
                deploymentId: deployment.deploymentId,
                artifactRootPrefix: response.artifactRootPrefix || props.TargetPrefix,
                templateVersion: response.templateVersion || templateVersion
              });

              await releaseRetentionLease(retentionLease);
              retentionLease = undefined;
              await sendResponse(event, context, "SUCCESS", {
                ArtifactRootPrefix: response.artifactRootPrefix || props.TargetPrefix,
                TemplateVersion: response.templateVersion || templateVersion,
                IntegrationEventBusName: integrationEventBusName,
                IntegrationEventConsumersEnabled: integrationEventConsumersEnabled,
                ...resolvedNames
              }, physicalResourceId);
            } catch (error) {
              logError("ArtifactStager request failed", error, {
                requestType: event.RequestType,
                logicalResourceId: event.LogicalResourceId,
                physicalResourceId
              });
              await sendResponse(event, context, "FAILED", {}, physicalResourceId, error && error.message ? error.message : String(error));
            } finally {
              if (retentionLease) {
                try { await releaseRetentionLease(retentionLease); }
                catch (error) { logWarn("Retention lease release deferred to expiry", { errorName: error && error.name }); }
              }
            }
          };
