Resources:
  DeploymentArtifactBucket:
    Type: "AWS::S3::Bucket"
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          -
            ServerSideEncryptionByDefault:
              SSEAlgorithm: "AES256"
      LifecycleConfiguration:
        Rules:
          -
            ExpirationInDays: 30
            Id: "ExpireCleanupEligibleArtifacts"
            Status: "Enabled"
            TagFilters:
              -
                Key: "wpsuite-artifact-retention"
                Value: "cleanup-eligible"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        -
          Key: "aws-apn-id"
          Value: "pc:5d8wq5hg1d54kb933ntenntiu"
  DeploymentArtifactBucketPolicy:
    Type: "AWS::S3::BucketPolicy"
    Properties:
      Bucket:
        Ref: "DeploymentArtifactBucket"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          -
            Sid: "DenyInsecureTransport"
            Effect: "Deny"
            Principal: "*"
            Action: "s3:*"
            Resource:
              -
                Fn::Sub:
                  - "arn:${AWS::Partition}:s3:::${Bucket}"
                  -
                    Bucket:
                      Ref: "DeploymentArtifactBucket"
              -
                Fn::Sub:
                  - "arn:${AWS::Partition}:s3:::${Bucket}/*"
                  -
                    Bucket:
                      Ref: "DeploymentArtifactBucket"
            Condition:
              Bool:
                aws:SecureTransport: "false"
  ArtifactIngressRole:
    Type: "AWS::IAM::Role"
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          -
            Effect: "Allow"
            Principal:
              AWS:
                Ref: "WpSuiteSellerArtifactDeployerRoleArn"
            Action: "sts:AssumeRole"
            Condition:
              StringEquals:
                sts:ExternalId:
                  Ref: "AWS::StackId"
      Description: "Allows the WP Suite Marketplace backend to stage authorized runtime artifacts into this stack bucket."
      Path: "/wpsuite/deployment-access/"
      Policies:
        -
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              -
                Effect: "Allow"
                Action: "s3:PutObject"
                Resource:
                  Fn::Sub:
                    - "arn:${AWS::Partition}:s3:::${Bucket}/${Prefix}*"
                    -
                      Bucket:
                        Ref: "DeploymentArtifactBucket"
                      Prefix:
                        Fn::Sub: "wpsuite-artifacts/${AWS::StackId}/"
                Condition:
                  StringEquals:
                    s3:x-amz-server-side-encryption: "AES256"
              -
                Effect: "Allow"
                Action: "s3:PutObjectTagging"
                Resource:
                  Fn::Sub:
                    - "arn:${AWS::Partition}:s3:::${Bucket}/${Prefix}*"
                    -
                      Bucket:
                        Ref: "DeploymentArtifactBucket"
                      Prefix:
                        Fn::Sub: "wpsuite-artifacts/${AWS::StackId}/"
              -
                Effect: "Allow"
                Action: "cloudformation:CreateChangeSet"
                Resource:
                  Fn::Sub: "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}/*"
                Condition:
                  StringLike:
                    cloudformation:ChangeSetName: "wpsuite-update-*"
                    cloudformation:TemplateUrl: "https://wpsuite-artifacts-*-*-*.s3.*.amazonaws.com/releases/*/templates/wpsuite-deployment-orchestrator-direct.yaml"
              -
                Effect: "Allow"
                Action:
                  - "cloudformation:DescribeChangeSet"
                  - "cloudformation:DescribeStacks"
                  - "cloudformation:DescribeStackEvents"
                  - "cloudformation:DescribeStackResources"
                  - "cloudformation:GetTemplate"
                Resource:
                  Fn::Sub: "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}/*"
              -
                Effect: "Allow"
                Action: "cloudformation:DeleteChangeSet"
                Resource:
                  Fn::Sub: "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}/*"
                Condition:
                  StringLike:
                    cloudformation:ChangeSetName: "wpsuite-update-*"
              -
                Effect: "Allow"
                Action: "cloudformation:ValidateTemplate"
                Resource: "*"
                Condition:
                  StringLike:
                    cloudformation:TemplateUrl: "https://wpsuite-artifacts-*-*-*.s3.*.amazonaws.com/releases/*/templates/wpsuite-deployment-orchestrator-direct.yaml"
          PolicyName: "WriteDeploymentArtifacts"
      Tags:
        -
          Key: "aws-apn-id"
          Value: "pc:5d8wq5hg1d54kb933ntenntiu"
        -
          Key: "WPSuitePurpose"
          Value: "deployment-artifact-ingress"
  ArtifactStagerFunctionRole:
