AWSTemplateFormatVersion: "2010-09-09"
Description: "WP Suite Cloud Deployment - Deploy the WP Suite backend into your own AWS account with the services required by your selected WP Suite products. Launched from the WP Suite console."
Parameters:
  MPS3BucketName:
    Type: "String"
    Default: "wpsuite-artifacts-637423296378-us-east-1-an"
    Description: "Public S3 bucket that contains the reviewed WP Suite CloudFormation templates."
  MPS3BucketRegion:
    Type: "String"
    Default: "us-east-1"
    Description: "Marketplace-provided bucket region that contains the reviewed WP Suite templates."
  MPS3KeyPrefix:
    Type: "String"
    Default: "releases/v1.1.6/templates/templates"
    Description: "S3 key prefix for the reviewed WP Suite nested CloudFormation templates."
  WpSuiteDeploymentSecretArn:
    Type: "String"
    Description: "AWS Marketplace Deployment Service secret ARN containing the WP Suite deployment context."
    MinLength: 1
    NoEcho: true
  DeploymentContextMode:
    Type: "String"
    Default: "direct"
    AllowedValues:
      - "marketplace_secret"
      - "direct"
    Description: "How the root template receives the WP Suite deployment context."
  WpSuiteDeploymentId:
    Type: "String"
    Default: ""
    Description: "Direct deployment session ID used by agency-credit CloudFormation launches."
    NoEcho: true
  WpSuiteDeploymentNonce:
    Type: "String"
    Default: ""
    Description: "Direct deployment nonce used by agency-credit CloudFormation launches."
    NoEcho: true
  WpSuiteExpectedAwsAccountId:
    Type: "String"
    Default: ""
    Description: "Expected buyer AWS account ID."
  WpSuiteSellerArtifactDeployerRoleArn:
    Type: "String"
    Default: "arn:aws:iam::637423296378:role/wpsuite-prod-marketplace-artifact-deployer"
    Description: "WP Suite seller-side IAM role ARN that is allowed to assume the buyer artifact ingress role."
  WpSuiteBackendApiBaseUrl:
    Type: "String"
    Default: "https://api.wpsuite.io/marketplace"
    Description: "WP Suite Marketplace backend API base URL."
  TemplateVersion:
    Type: "String"
    Default: "v1.1.6"
    Description: "Immutable WP Suite deployment template version."
  DeployCognito:
    Type: "String"
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: "Deploy WP Suite Cognito identity foundation."
  DeployAiKitBackend:
    Type: "String"
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: "Deploy WP Suite AI Kit backend."
  DeployFlowBackend:
    Type: "String"
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: "Deploy WP Suite Flow backend."
  DeployStaticGuardian:
    Type: "String"
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: "Deploy WP Suite Static Site Guardian."
  DeployDrBackup:
    Type: "String"
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: "Deploy scheduled AWS Backup disaster recovery resources."
  Environment:
    Type: "String"
    Default: "prod"
    Description: "Deployment environment used in generated WP Suite component resource names."
  EnableAlerts:
    Type: "String"
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: "Enable shared SNS email alerting for selected WP Suite backends. Confirm pending subscriptions from the buyer SNS console by pasting the email confirmation URL; do not open the email link directly."
  EnableDetailedLogging:
    Type: "String"
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: "Enable detailed INFO-level API Gateway and Static Guardian troubleshooting logs."
  EnableApiWAF:
    Type: "String"
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: "Enable a shared regional AWS WAF WebACL for selected WP Suite APIs."
  EnableDynamoDbPointInTimeRecovery:
    Type: "String"
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    Description: "Enable DynamoDB point-in-time recovery for persistent WP Suite nested-stack tables."
  ApiPublicAllowedIPs:
    Type: "String"
    Default: ""
    Description: "Optional CIDR allowlist for public API endpoints when shared API WAF is enabled."
  ApiAdminAllowedIPs:
    Type: "String"
    Default: ""
    Description: "Optional CIDR allowlist for admin API endpoints when shared API WAF is enabled."
  ApiBlockedIPs:
    Type: "String"
    Default: ""
    Description: "Optional CIDR blocklist for all API endpoints when shared API WAF is enabled."
  AlertEmailAddress1:
    Type: "String"
    Default: ""
    Description: "Alert email recipient 1. Leave empty when unused. Confirm from the buyer SNS console to require authenticated unsubscribe."
  AlertEmailAddress2:
    Type: "String"
    Default: ""
    Description: "Alert email recipient 2. Leave empty when unused. Confirm from the buyer SNS console to require authenticated unsubscribe."
  AlertEmailAddress3:
    Type: "String"
    Default: ""
    Description: "Alert email recipient 3. Leave empty when unused. Confirm from the buyer SNS console to require authenticated unsubscribe."
  AlertEmailAddress4:
    Type: "String"
    Default: ""
    Description: "Alert email recipient 4. Leave empty when unused. Confirm from the buyer SNS console to require authenticated unsubscribe."
  AlertEmailAddress5:
    Type: "String"
    Default: ""
    Description: "Alert email recipient 5. Leave empty when unused. Confirm from the buyer SNS console to require authenticated unsubscribe."
  StaticGuardianDomainName:
    Type: "String"
    Default: ""
    Description: "Custom domain for the Static Site Guardian CloudFront distribution."
  StaticGuardianCertificateArn:
    Type: "String"
    Default: ""
    Description: "ACM certificate ARN in us-east-1 for the Static Site Guardian CloudFront distribution."
  StaticGuardianProtectedPaths:
    Type: "String"
    Default: "/restricted"
    Description: "Comma-separated protected paths for Static Site Guardian."
  StaticGuardianSigninPagePath:
    Type: "String"
    Default: "/signin"
    Description: "Sign-in path used by Static Site Guardian."
  StaticGuardianEnableHomepageLocaleRouting:
    Type: "String"
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: "Redirect the exact Static Guardian homepage according to an allowlisted locale route map."
  StaticGuardianHomepageLocaleRoutes:
    Type: "String"
    Default: "{}"
    Description: "JSON object mapping BCP 47 locale tags to canonical root-relative homepage paths ending in slash."
    MaxLength: 2048
  StaticGuardianHomepageLocaleCookieName:
    Type: "String"
    Default: "wpsuite_locale"
    AllowedPattern: "^[A-Za-z0-9_.-]{1,64}$"
    Description: "Cookie containing the explicit homepage locale preference."
  StaticGuardianHomepageDefaultLocale:
    Type: "String"
    Default: "en"
    AllowedPattern: "^[A-Za-z]{2,3}(?:-[A-Za-z0-9]{2,8})*$"
    Description: "Default BCP 47 locale served at the unprefixed homepage."
  StaticGuardianEnableAcceptLanguageHomepageRouting:
    Type: "String"
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: "Use q-weighted Accept-Language when no supported homepage locale cookie is present."
  StaticGuardianPublicCacheMode:
    Type: "String"
    Default: "fixed-7d"
    AllowedValues:
      - "fixed-1d"
      - "fixed-7d"
      - "fixed-30d"
      - "managed-optimized"
    Description: "CloudFront edge cache mode for the public Static Guardian default behavior."
  StaticGuardianAdditionalOrigins:
    Type: "String"
    Default: "-~-~-~-~-~-~-~-|-~-~-~-~-~-~-~-|-~-~-~-~-~-~-~-|-~-~-~-~-~-~-~-|-~-~-~-~-~-~-~-"
    AllowedPattern: "^[^|~]*(?:~[^|~]*){7}(?:\\|[^|~]*(?:~[^|~]*){7}){4}$"
    Description: "Five packed optional CloudFront origin records for Static Site Guardian."
    MaxLength: 4096
  StaticGuardianAdditionalCacheBehaviors:
    Type: "String"
    Default: "-~-~-~-~-~-~-~-|-~-~-~-~-~-~-~-|-~-~-~-~-~-~-~-|-~-~-~-~-~-~-~-|-~-~-~-~-~-~-~-|-~-~-~-~-~-~-~-|-~-~-~-~-~-~-~-|-~-~-~-~-~-~-~-|-~-~-~-~-~-~-~-|-~-~-~-~-~-~-~-"
    AllowedPattern: "^(?!(?:/issue-cookie|/restricted|/smartcloud-wpsuiteio))[^|~]*(?:~[^|~]*){7}(?:\\|(?!(?:/issue-cookie|/restricted|/smartcloud-wpsuiteio))[^|~]*(?:~[^|~]*){7}){9}$"
    Description: "Ten packed optional ordered CloudFront cache behavior records for Static Site Guardian."
    MaxLength: 4096
  StaticGuardianAdditionalFunctionAssociations:
    Type: "String"
    Default: "-~-|-~-|-~-|-~-|-~-|-~-|-~-|-~-|-~-|-~-"
    AllowedPattern: "^[^|~]*(?:~[^|~]*){1}(?:\\|[^|~]*(?:~[^|~]*){1}){9}$"
    Description: "Ten packed CloudFront Function association records for Static Guardian."
    MaxLength: 4096
  StaticGuardianAdditionalViewerLambdaAssociations:
    Type: "String"
    Default: "-~-~-|-~-~-|-~-~-|-~-~-|-~-~-|-~-~-|-~-~-|-~-~-|-~-~-|-~-~-"
    AllowedPattern: "^[^|~]*(?:~[^|~]*){2}(?:\\|[^|~]*(?:~[^|~]*){2}){9}$"
    Description: "Ten packed viewer Lambda@Edge association records for Static Guardian."
    MaxLength: 4096
  StaticGuardianAdditionalOriginLambdaAssociations:
    Type: "String"
    Default: "-~-~-|-~-~-|-~-~-|-~-~-|-~-~-|-~-~-|-~-~-|-~-~-|-~-~-|-~-~-"
    AllowedPattern: "^[^|~]*(?:~[^|~]*){2}(?:\\|[^|~]*(?:~[^|~]*){2}){9}$"
    Description: "Ten packed origin Lambda@Edge association records for Static Guardian."
    MaxLength: 4096
  CognitoPostLoginRedirectUrl:
    Type: "String"
    Default: "https://example.com/signin"
    Description: "OAuth callback URL for the Cognito app client."
  CognitoTokenValidityConfig:
    Type: "String"
    Default: "1,hours,1,hours,30,days"
    AllowedPattern: "^[1-9][0-9]*,(seconds|minutes|hours|days),[1-9][0-9]*,(seconds|minutes|hours|days),[1-9][0-9]*,(seconds|minutes|hours|days)$"
    Description: "Packed Cognito access, ID, and refresh token validity quantities and units in value,unit,value,unit,value,unit order."
    MaxLength: 4096
  CognitoAgentComposerMcpOAuthConfig:
    Type: "String"
    Default: "false|https://example.com/connector/oauth/callback|https://example.com/mcp"
    AllowedPattern: "^(true|false)\\|https://[^|\\s#]+\\|https://[^|\\s?#]+[^/|\\s?#](?:\\|(none|cognito-default))?$"
    Description: "Packed optional Agent Composer MCP OAuth configuration in enabled|https-callback-url|https-resource-uri|managed-login-branding order."
    MaxLength: 4096
  CognitoIdentityEventsMode:
    Type: "String"
    Default: "disabled"
    AllowedValues:
      - "disabled"
      - "provisioned"
      - "active"
    Description: "Optional identity lifecycle events: disabled, provisioned without publishing, or active."
  CognitoIdentityClaimsProviderArn:
    Type: "String"
    Default: ""
    AllowedPattern: "^(?:|arn:(aws|aws-us-gov|aws-cn):lambda:[a-z0-9-]+:[0-9]{12}:function:[A-Za-z0-9-_]{1,64}:([A-Za-z0-9-_]{1,128}|[0-9]+)(?:\\|[A-Za-z0-9]{1,128}(?:,[A-Za-z0-9]{1,128}){0,99})?)$"
    Description: "Optional qualified same-account/region claims Lambda ARN, optionally followed by | and comma-separated native client IDs. ARN-only preserves previous client behavior."
    MaxLength: 4096
  CognitoRegisteredGroupName:
    Type: "String"
    Default: "registered"
    Description: "Default Cognito group assigned to confirmed users."
  CognitoAdminGroupName:
    Type: "String"
    Default: "admin"
    Description: "Cognito administrator group name."
  CognitoGroupConfiguration:
    Type: "String"
    Default: ""
    AllowedPattern: "^(?:|[a-z0-9][a-z0-9._-]{0,127}\\|[a-z0-9][a-z0-9._-]{0,127}\\|(?:[a-z0-9][a-z0-9._-]{0,127}(?:,[a-z0-9][a-z0-9._-]{0,127})*)?)$"
    Description: "Packed registered|admin|additional1,additional2 Cognito group configuration. Leave empty to use the legacy group-name parameters."
    MaxLength: 4096
  CognitoCreateIdentityPool:
    Type: "String"
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    Description: "Create a Cognito Identity Pool in the Cognito nested stack."
  CognitoEnableCustomEmailSender:
    Type: "String"
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: "Enable the Cognito custom email sender Lambda."
  CognitoOverwriteEmailTemplates:
    Type: "String"
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: "Replace existing Cognito email templates with the bundled WP Suite defaults. Leave false to preserve custom templates."
  CognitoEnableRecaptcha:
    Type: "String"
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: "Enable reCAPTCHA in Cognito pre sign-up."
  RecaptchaMode:
    Type: "String"
    Default: "enterprise"
    AllowedValues:
      - "enterprise"
      - "classic"
    Description: "Shared reCAPTCHA mode used by selected WP Suite nested stacks."
  RecaptchaProjectId:
    Type: "String"
    Default: ""
    Description: "Google Cloud project ID for reCAPTCHA Enterprise."
  RecaptchaSiteKey:
    Type: "String"
    Default: ""
    Description: "Public reCAPTCHA site key expected by frontend clients."
  RecaptchaSecretKey:
    Type: "String"
    Default: ""
    Description: "Shared reCAPTCHA secret key used by selected WP Suite nested stacks."
    NoEcho: true
  RecaptchaScoreThreshold:
    Type: "Number"
    Default: 0.5
    Description: "Minimum accepted reCAPTCHA score from 0.0 to 1.0."
  RecaptchaChatTtlSeconds:
    Type: "Number"
    Default: 120
    Description: "AI Kit chat reCAPTCHA verification cache TTL in seconds."
  AiKitEnvironment:
    Type: "String"
    Default: "prod"
    Description: "Deployment environment for the WP Suite AI Kit nested stack."
  AiKitAdminApiAuthMode:
    Type: "String"
    Default: "IAM"
    Description: "AI Kit admin API authorization mode."
  AiKitAdminCognitoAuthScopes:
    Type: "String"
    Default: ""
    Description: "Optional OAuth scopes required for AI Kit admin Cognito authorization."
  AiKitFrontendApiAuthMode:
    Type: "String"
    Default: "NONE"
    Description: "AI Kit frontend API authorization mode."
  AiKitFrontendCognitoAuthScopes:
    Type: "String"
    Default: ""
    Description: "Optional OAuth scopes required for AI Kit frontend Cognito authorization."
  AiKitFrontendModelId:
    Type: "String"
    Default: "amazon.nova-lite-v1:0"
    Description: "Bedrock model ID used by AI Kit frontend endpoints."
  AiKitModelId:
    Type: "String"
    Default: "amazon.nova-lite-v1:0"
    Description: "Bedrock model ID used by AI Kit admin/backend endpoints."
  AiKitPresentationModelId:
    Type: "String"
    Default: "qwen.qwen3-32b-v1:0"
    Description: "Bedrock model ID for final language review. Where Qwen3 32B is unavailable, its default uses the global Haiku 4.5 profile, which may route across Regions."
  AiKitKnowledgeTaxonomyPathsMode:
    Type: "String"
    Default: "legacy"
    AllowedValues:
      - "legacy"
      - "migration"
      - "ready"
    Description: "AI Kit category path rollout. Select ready only after complete metadata reconciliation and ingestion."
  AiKitKnowledgeBaseId:
    Type: "String"
    Default: ""
    Description: "Existing Bedrock Knowledge Base ID for AI Kit, or empty to create one."
  AiKitMonthlyAiSpendLimitUsd:
    Type: "Number"
    Default: 0
    Description: "Approximate monthly AI spend limit in USD. Zero disables the runtime cost gate."
    MaxValue: 1000000
    MinValue: 0
  AiKitSpendSafetyPercent:
    Type: "Number"
    Default: 90
    Description: "Percentage of the monthly AI limit at which new AI work is stopped."
    MaxValue: 100
    MinValue: 50
  AiKitEnableChatbotBackend:
    Type: "String"
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: "Enable AI Kit chatbot frontend endpoint."
  AiKitEnableChatStreaming:
    Type: "String"
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: "Enable asynchronous WebSocket chat transport for AI Kit."
  AiKitEnableSummarizerBackend:
    Type: "String"
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: "Enable AI Kit summarizer frontend endpoint."
  AiKitEnableLanguageAIBackend:
    Type: "String"
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: "Enable AI Kit language assistant frontend endpoints."
  AiKitEnableAgentCoreCodeInterpreter:
    Type: "String"
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: "Enable isolated AgentCore Code Interpreter execution for AI Kit script runner tools."
  AiKitEnableRecaptcha:
    Type: "String"
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: "Enable reCAPTCHA for AI Kit frontend APIs."
  FlowEnvironment:
    Type: "String"
    Default: "prod"
    Description: "Deployment environment for the WP Suite Flow nested stack."
  FlowFrontendApiAuthMode:
    Type: "String"
    Default: "NONE"
    Description: "Flow frontend API authorization mode."
  FlowAdminApiAuthMode:
    Type: "String"
    Default: "COGNITO"
    Description: "Flow admin API authorization mode."
  FlowAdminCognitoAuthScopes:
    Type: "String"
    Default: ""
    Description: "Optional OAuth scopes required for Flow admin Cognito authorization."
  FlowPayloadBucketName:
    Type: "String"
    Default: ""
    Description: "Existing S3 bucket for Flow payload uploads, or empty to create one."
  FlowTemplatesBucketName:
    Type: "String"
    Default: ""
    Description: "Existing S3 bucket for Flow templates, or empty to create one."
  FlowFromEmail:
    Type: "String"
    Default: ""
    Description: "SES-verified sender email address for Flow outbound email actions."
  FlowEnableRecaptcha:
    Type: "String"
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: "Enable reCAPTCHA for Flow public form submissions."
  FlowEnableKmsForSecrets:
    Type: "String"
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: "Create a dedicated KMS key for Flow SSM-stored secrets."
  FlowDataRetentionDays:
    Type: "Number"
    Default: 30
    Description: "Number of days to retain Flow submission data."
    MaxValue: 3650
    MinValue: 1
  StaticGuardianS3BucketName:
    Type: "String"
    Default: ""
    Description: "Existing/static S3 bucket name for Static Site Guardian, or empty to generate one."
  StaticGuardianS3WWWRoot:
    Type: "String"
    Default: "wwwroot"
    Description: "S3 web root prefix for Static Site Guardian."
  StaticGuardianCreateDNSRecords:
    Type: "String"
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    Description: "Create Route 53 records for Static Site Guardian."
  StaticGuardianManageSigningKeys:
    Type: "String"
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    Description: "Create and manage CloudFront signing keys for Static Site Guardian."
  StaticGuardianEnableCloudFrontWAF:
    Type: "String"
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: "Enable AWS WAF protection for the Static Guardian CloudFront distribution."
  DrBackupDestinationRegion:
    Type: "String"
    Default: ""
    Description: "Secondary AWS Region where copied DR backup recovery points are stored."
  DrBackupSourceBackupVaultName:
    Type: "String"
    Default: ""
    Description: "Optional source-region AWS Backup vault name. Leave empty to generate one."
  DrBackupDestinationBackupVaultName:
    Type: "String"
    Default: ""
    Description: "Optional secondary-region AWS Backup vault name. Leave empty to generate one."
  DrBackupScheduleExpression:
    Type: "String"
    Default: "cron(0 3 * * ? *)"
    Description: "AWS Backup cron or rate expression for scheduled DR backups."
  DrBackupBackupStartWindowMinutes:
    Type: "Number"
    Default: 60
    Description: "Minutes after schedule start during which AWS Backup can start a backup job."
  DrBackupBackupCompletionWindowMinutes:
    Type: "Number"
    Default: 360
    Description: "Minutes after backup start during which AWS Backup must complete the job."
  DrBackupBackupRetentionDays:
    Type: "Number"
    Default: 35
    Description: "Days to retain source-region recovery points."
  DrBackupCopyRetentionDays:
    Type: "Number"
    Default: 35
    Description: "Days to retain copied recovery points in the secondary Region."
  DrBackupIncludeDynamoDb:
    Type: "String"
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    Description: "Include WP Suite DynamoDB tables in scheduled DR backups."
  DrBackupIncludeS3:
    Type: "String"
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    Description: "Include WP Suite S3 buckets in scheduled DR backups."
  CognitoUserPoolName:
    Type: "String"
    Default: ""
    Description: "Cognito nested stack parameter UserPoolName."
    NoEcho: false
  CognitoLoginMechanisms:
    Type: "String"
    Default: "email"
    Description: "Cognito nested stack parameter LoginMechanisms."
    NoEcho: false
  CognitoOAuthScopes:
    Type: "String"
    Default: "aws.cognito.signin.user.admin,email,openid,profile"
    Description: "Cognito nested stack parameter OAuthScopes."
    NoEcho: false
  CognitoRequireEmailAttribute:
    Type: "String"
    Default: "false"
    Description: "Cognito nested stack parameter RequireEmailAttribute."
    NoEcho: false
  CognitoRequireGivenNameAttribute:
    Type: "String"
    Default: "false"
    Description: "Cognito nested stack parameter RequireGivenNameAttribute."
    NoEcho: false
  CognitoRequireFamilyNameAttribute:
    Type: "String"
    Default: "false"
    Description: "Cognito nested stack parameter RequireFamilyNameAttribute."
    NoEcho: false
  CognitoRequirePhoneNumberAttribute:
    Type: "String"
    Default: "false"
    Description: "Cognito nested stack parameter RequirePhoneNumberAttribute."
    NoEcho: false
  CognitoEnablePreSignUp:
    Type: "String"
    Default: "true"
    Description: "Cognito nested stack parameter EnablePreSignUp."
    NoEcho: false
  CognitoEnablePreTokenGeneration:
    Type: "String"
    Default: "true"
    Description: "Cognito nested stack parameter EnablePreTokenGeneration."
    NoEcho: false
  CognitoEnablePostConfirmation:
    Type: "String"
    Default: "true"
    Description: "Cognito nested stack parameter EnablePostConfirmation."
    NoEcho: false
  CognitoEnablePasskeySignIn:
    Type: "String"
    Default: "true"
    Description: "Cognito nested stack parameter EnablePasskeySignIn."
    NoEcho: false
  CognitoEnableEmailOtpSignIn:
    Type: "String"
    Default: "false"
    Description: "Cognito nested stack parameter EnableEmailOtpSignIn."
    NoEcho: false
  CognitoPasskeyRelyingPartyId:
    Type: "String"
    Default: ""
    Description: "Cognito nested stack parameter PasskeyRelyingPartyId."
    NoEcho: false
  CognitoPasskeyThirdPartyDomain:
    Type: "String"
    Default: ""
    Description: "Cognito nested stack parameter PasskeyThirdPartyDomain."
    NoEcho: false
  CognitoMfaMode:
    Type: "String"
    Default: "no"
    Description: "Cognito nested stack parameter MfaMode."
    NoEcho: false
  CognitoDeviceTrackingMode:
    Type: "String"
    Default: "none"
    Description: "Cognito nested stack parameter DeviceTrackingMode."
    NoEcho: false
  CognitoVerifyAttributeChanges:
    Type: "String"
    Default: "true"
    Description: "Cognito nested stack parameter VerifyAttributeChanges."
    NoEcho: false
  CognitoVerifyAttributeChangesMode:
    Type: "String"
    Default: "auto"
    Description: "Cognito nested stack parameter VerifyAttributeChangesMode."
    NoEcho: false
  CognitoEnableSoftwareTokenMfa:
    Type: "String"
    Default: "true"
    Description: "Cognito nested stack parameter EnableSoftwareTokenMfa."
    NoEcho: false
  CognitoEnablePasskeyMfa:
    Type: "String"
    Default: "true"
    Description: "Cognito nested stack parameter EnablePasskeyMfa."
    NoEcho: false
  CognitoEnableEmailOtpMfa:
    Type: "String"
    Default: "false"
    Description: "Cognito nested stack parameter EnableEmailOtpMfa."
    NoEcho: false
  CognitoEnableSmsMfa:
    Type: "String"
    Default: "false"
    Description: "Cognito nested stack parameter EnableSmsMfa."
    NoEcho: false
  CognitoCreateCustomDomain:
    Type: "String"
    Default: "false"
    Description: "Cognito nested stack parameter CreateCustomDomain."
    NoEcho: false
  CognitoRegisterRoute53Alias:
    Type: "String"
    Default: "false"
    Description: "Cognito nested stack parameter RegisterRoute53Alias."
    NoEcho: false
  CognitoUserPoolCustomDomainSubdomain:
