  DeploymentOutputReporterFunction:
    Type: AWS::Lambda::Function
    Properties:
      Code:
        ZipFile: |

          const https = require("https");
          const url = require("url");
          const { SecretsManagerClient, GetSecretValueCommand } = require("@aws-sdk/client-secrets-manager");
          const { CloudWatchLogsClient, PutRetentionPolicyCommand } = require("@aws-sdk/client-cloudwatch-logs");

          const logs = new CloudWatchLogsClient({});

          function logInfo(message, data) {
            console.info(JSON.stringify({ level: "INFO", message, data: data || {} }));
          }

          function logWarn(message, data) {
            console.warn(JSON.stringify({ level: "WARN", message, data: data || {} }));
          }

          function logError(message, error, data) {
            console.error(JSON.stringify({
              level: "ERROR",
              message,
              data: data || {},
              error: {
                name: error && error.name,
                message: error && error.message ? error.message : String(error),
                stack: error && error.stack
              }
            }));
          }

          async function configureLogRetention(retentionValue) {
            const retentionInDays = Number(retentionValue || "");
            if (!Number.isInteger(retentionInDays) || retentionInDays <= 0) {
              if (retentionValue) {
                logWarn("Skipping OutputReporter log retention value", { retentionValue });
              }
              return;
            }
            const functionName = process.env.AWS_LAMBDA_FUNCTION_NAME;
            if (!functionName) {
              logWarn("Skipping OutputReporter log retention because function name is unavailable");
              return;
            }
            const logGroupName = "/aws/lambda/" + functionName;
            try {
              await logs.send(new PutRetentionPolicyCommand({ logGroupName, retentionInDays }));
              logInfo("OutputReporter log retention configured", { logGroupName, retentionInDays });
            } catch (error) {
              logWarn("OutputReporter log retention could not be configured", {
                logGroupName,
                retentionInDays,
                errorName: error && error.name,
                errorMessage: error && error.message ? error.message : String(error)
              });
            }
          }

          function requestJson(endpoint, body) {
            return new Promise((resolve, reject) => {
              const parsed = new url.URL(endpoint);
              const payload = JSON.stringify(body);
              const req = https.request({
                hostname: parsed.hostname,
                path: parsed.pathname + parsed.search,
                method: "POST",
                headers: {
                  "content-type": "application/json",
                  "content-length": Buffer.byteLength(payload)
                }
              }, (res) => {
                let data = "";
                res.on("data", (chunk) => { data += chunk; });
                res.on("end", () => {
                  if (res.statusCode < 200 || res.statusCode >= 300) {
                    reject(new Error("WP Suite backend returned " + res.statusCode + (data ? ": " + data : "")));
                    return;
                  }
                  resolve(data ? JSON.parse(data) : {});
                });
              });
              req.on("error", reject);
              req.write(payload);
              req.end();
            });
          }

          function sendResponse(event, context, status, data, physicalResourceId, reason) {
            return new Promise((resolve, reject) => {
              const body = JSON.stringify({
                Status: status,
                Reason: reason || ("See CloudWatch Log Stream: " + context.logStreamName),
                PhysicalResourceId: physicalResourceId || context.logStreamName,
                StackId: event.StackId,
                RequestId: event.RequestId,
                LogicalResourceId: event.LogicalResourceId,
                NoEcho: false,
                Data: data || {}
              });
              const parsed = new url.URL(event.ResponseURL);
              const req = https.request({
                hostname: parsed.hostname,
                path: parsed.pathname + parsed.search,
                method: "PUT",
                headers: {
                  "content-type": "",
                  "content-length": Buffer.byteLength(body)
                }
              }, (res) => {
                res.resume();
                res.on("end", resolve);
              });
              req.on("error", reject);
              req.write(body);
              req.end();
            });
          }

          async function deploymentContext(props) {
            if (props.DeploymentContextMode === "direct") {
              if (!props.DeploymentId || !props.DeploymentNonce) {
                throw new Error("Direct WP Suite deployment context is incomplete");
              }
              return {
                deploymentId: props.DeploymentId,
                nonce: props.DeploymentNonce
              };
            }

            if (!props.DeploymentSecretArn) {
              throw new Error("WP Suite deployment secret ARN is missing");
            }

            const secrets = new SecretsManagerClient({});
            const secret = await secrets.send(new GetSecretValueCommand({
              SecretId: props.DeploymentSecretArn
            }));
            if (!secret.SecretString) {
              throw new Error("WP Suite deployment secret is empty");
            }

            const parsed = JSON.parse(secret.SecretString);
            if (!parsed.deploymentId || !parsed.nonce) {
              throw new Error("WP Suite deployment secret is missing required fields");
            }
            return parsed;
          }

          function mergeDeploymentContextOutputs(outputs, deployment) {
            const normalized = outputs || {};
            const topology = deployment.topology || {};
            if (normalized.root) {
              normalized.root.templateVersion = deployment.templateVersion || normalized.root.templateVersion || "";
            }
            if (normalized.cognito) {
              normalized.cognito.deployed = topology.DeployCognito || normalized.cognito.deployed || "false";
            }
            if (normalized.aiKitBackend) {
              normalized.aiKitBackend.deployed = topology.DeployAiKitBackend || normalized.aiKitBackend.deployed || "false";
            }
            if (normalized.flowBackend) {
              normalized.flowBackend.deployed = topology.DeployFlowBackend || normalized.flowBackend.deployed || "false";
            }
            if (normalized.staticGuardian) {
              normalized.staticGuardian.deployed = topology.DeployStaticGuardian || normalized.staticGuardian.deployed || "false";
            }
            if (normalized.drBackup) {
              normalized.drBackup.deployed = topology.DeployDrBackup || normalized.drBackup.deployed || "false";
            }
            return normalized;
          }

          exports.handler = async (event, context) => {
            const physicalResourceId = event.PhysicalResourceId || "wpsuite-deployment-output-reporter";
            const props = event.ResourceProperties || {};
            logInfo("OutputReporter request received", {
              requestType: event.RequestType,
              logicalResourceId: event.LogicalResourceId,
              physicalResourceId,
              stackId: event.StackId,
              deploymentContextMode: props.DeploymentContextMode,
              backendApiBaseUrl: props.BackendApiBaseUrl
            });
            try {
              await configureLogRetention(props.LogRetentionDays);

              const deployment = await deploymentContext(props);
              if (event.RequestType === "Delete") {
                const endpoint = String(props.BackendApiBaseUrl || "").replace(/\/$/, "") + "/deployment/" + encodeURIComponent(deployment.deploymentId) + "/outputs";
                logInfo("OutputReporter calling WP Suite backend for delete", {
                  endpoint,
                  deploymentId: deployment.deploymentId
                });
                const response = await requestJson(endpoint, {
                  nonce: deployment.nonce,
                  stackId: event.StackId,
                  requestId: event.RequestId,
                  operation: event.RequestType,
                  region: process.env.AWS_REGION,
                  outputs: {}
                });
                logInfo("OutputReporter delete backend call completed", {
                  deploymentId: deployment.deploymentId,
                  status: response.status || ""
                });
                await sendResponse(event, context, "SUCCESS", {
                  DeploymentId: deployment.deploymentId,
                  Status: response.status || ""
                }, physicalResourceId);
                return;
              }

              const outputs = mergeDeploymentContextOutputs(props.Outputs || {}, deployment);
              const endpoint = String(props.BackendApiBaseUrl || "").replace(/\/$/, "") + "/deployment/" + encodeURIComponent(deployment.deploymentId) + "/outputs";
              logInfo("OutputReporter calling WP Suite backend", {
                endpoint,
                deploymentId: deployment.deploymentId,
                outputGroups: Object.keys(outputs || {})
              });
              const response = await requestJson(endpoint, {
                nonce: deployment.nonce,
                stackId: event.StackId,
                requestId: event.RequestId,
                operation: event.RequestType,
                region: process.env.AWS_REGION,
                outputs
              });
              logInfo("OutputReporter backend call completed", {
                deploymentId: deployment.deploymentId,
                outputsHash: response.outputsHash || "",
                capturedAt: response.capturedAt || ""
              });

              await sendResponse(event, context, "SUCCESS", {
                DeploymentId: deployment.deploymentId,
                OutputsHash: response.outputsHash || "",
                CapturedAt: response.capturedAt || ""
              }, physicalResourceId);
            } catch (error) {
              logError("OutputReporter request failed", error, {
                requestType: event.RequestType,
                logicalResourceId: event.LogicalResourceId,
                physicalResourceId
              });
              await sendResponse(event, context, "FAILED", {}, physicalResourceId, error && error.message ? error.message : String(error));
            }
          };
      Environment:
        Variables:
          WPSUITE_MARKETPLACE_DEPLOYMENT_PRODUCT_CODE: 5d8wq5hg1d54kb933ntenntiu
          AWS_SDK_UA_APP_ID: APN_1.1/pc_5d8wq5hg1d54kb933ntenntiu$
      FunctionName:
        Fn::Sub: ${AWS::StackName}-output-reporter
      Handler: index.handler
      MemorySize: 256
      Role:
        Fn::GetAtt:
          - ArtifactStagerFunctionRole
          - Arn
      Runtime: nodejs24.x
