AWSTemplateFormatVersion: "2010-09-09"
Description: "WP Suite Cloud Deployment - Deploy the WP Suite backend into your own AWS account with the services required by your selected WP Suite products. AWS Marketplace Quick Launch through WP Suite Deployment Access."
Parameters:
  MPS3BucketName:
    Type: "String"
    Default: "wpsuite-artifacts-637423296378-us-east-1-an"
    Description: "Public S3 bucket that contains the reviewed WP Suite CloudFormation templates."
  MPS3BucketRegion:
    Type: "String"
    Default: "us-east-1"
    Description: "Marketplace-provided bucket region that contains the reviewed WP Suite templates."
  MPS3KeyPrefix:
    Type: "String"
    Default: "releases/v1.1.6/templates/templates"
    Description: "S3 key prefix for the reviewed WP Suite nested CloudFormation templates."
  WpSuiteDeploymentSecretArn:
    Type: "String"
    Description: "AWS Marketplace Deployment Service secret ARN containing the WP Suite deployment context."
    MinLength: 1
    NoEcho: true
  AiKitKnowledgeTaxonomyPathsMode:
    Type: "String"
    Default: "legacy"
    AllowedValues:
      - "legacy"
      - "migration"
      - "ready"
    Description: "AI Kit category path rollout. Select ready only after complete metadata reconciliation and ingestion."
Mappings:
  WpSuiteMarketplace:
    DeploymentAccess:
      ProductCode: "5d8wq5hg1d54kb933ntenntiu"
Conditions:
  QwenPresentationRegionalFallback:
    Fn::And:
      -
        Fn::Equals:
          - "qwen.qwen3-32b-v1:0"
          - "qwen.qwen3-32b-v1:0"
      -
        Fn::Not:
          -
            Fn::Or:
              -
                Fn::Or:
                  -
                    Fn::Equals:
                      -
                        Ref: "AWS::Region"
                      - "us-east-1"
                  -
                    Fn::Equals:
                      -
                        Ref: "AWS::Region"
                      - "us-east-2"
                  -
                    Fn::Equals:
                      -
                        Ref: "AWS::Region"
                      - "us-west-2"
                  -
                    Fn::Equals:
                      -
                        Ref: "AWS::Region"
                      - "eu-central-1"
                  -
                    Fn::Equals:
                      -
                        Ref: "AWS::Region"
                      - "eu-north-1"
                  -
                    Fn::Equals:
                      -
                        Ref: "AWS::Region"
                      - "eu-south-1"
                  -
                    Fn::Equals:
                      -
                        Ref: "AWS::Region"
                      - "eu-west-1"
                  -
                    Fn::Equals:
                      -
                        Ref: "AWS::Region"
                      - "eu-west-2"
              -
                Fn::Or:
                  -
                    Fn::Equals:
                      -
                        Ref: "AWS::Region"
                      - "ap-northeast-1"
                  -
                    Fn::Equals:
                      -
                        Ref: "AWS::Region"
                      - "ap-south-1"
                  -
                    Fn::Equals:
                      -
                        Ref: "AWS::Region"
                      - "ap-southeast-2"
                  -
                    Fn::Equals:
                      -
                        Ref: "AWS::Region"
                      - "ap-southeast-3"
                  -
                    Fn::Equals:
                      -
                        Ref: "AWS::Region"
                      - "sa-east-1"
Resources:
  DeploymentArtifactBucket:
    Type: "AWS::S3::Bucket"
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          -
            ServerSideEncryptionByDefault:
              SSEAlgorithm: "AES256"
      LifecycleConfiguration:
        Rules:
          -
            ExpirationInDays: 30
            Id: "ExpireCleanupEligibleArtifacts"
            Status: "Enabled"
            TagFilters:
              -
                Key: "wpsuite-artifact-retention"
                Value: "cleanup-eligible"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        -
          Key: "aws-apn-id"
          Value: "pc:5d8wq5hg1d54kb933ntenntiu"
  DeploymentArtifactBucketPolicy:
    Type: "AWS::S3::BucketPolicy"
    Properties:
      Bucket:
        Ref: "DeploymentArtifactBucket"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          -
            Sid: "DenyInsecureTransport"
            Effect: "Deny"
            Principal: "*"
            Action: "s3:*"
            Resource:
              -
                Fn::Sub:
                  - "arn:${AWS::Partition}:s3:::${Bucket}"
                  -
                    Bucket:
                      Ref: "DeploymentArtifactBucket"
              -
                Fn::Sub:
                  - "arn:${AWS::Partition}:s3:::${Bucket}/*"
                  -
                    Bucket:
                      Ref: "DeploymentArtifactBucket"
            Condition:
              Bool:
                aws:SecureTransport: "false"
  ArtifactIngressRole:
    Type: "AWS::IAM::Role"
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          -
            Effect: "Allow"
            Principal:
              AWS: "arn:aws:iam::637423296378:role/wpsuite-prod-marketplace-artifact-deployer"
            Action: "sts:AssumeRole"
            Condition:
              StringEquals:
                sts:ExternalId:
                  Ref: "AWS::StackId"
      Description: "Allows the WP Suite Marketplace backend to stage authorized runtime artifacts into this stack bucket."
      Path: "/wpsuite/deployment-access/"
      Policies:
        -
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              -
                Effect: "Allow"
                Action: "s3:PutObject"
                Resource:
                  Fn::Sub:
                    - "arn:${AWS::Partition}:s3:::${Bucket}/${Prefix}*"
                    -
                      Bucket:
                        Ref: "DeploymentArtifactBucket"
                      Prefix:
                        Fn::Sub: "wpsuite-artifacts/${AWS::StackId}/"
                Condition:
                  StringEquals:
                    s3:x-amz-server-side-encryption: "AES256"
              -
                Effect: "Allow"
                Action: "s3:PutObjectTagging"
                Resource:
                  Fn::Sub:
                    - "arn:${AWS::Partition}:s3:::${Bucket}/${Prefix}*"
                    -
                      Bucket:
                        Ref: "DeploymentArtifactBucket"
                      Prefix:
                        Fn::Sub: "wpsuite-artifacts/${AWS::StackId}/"
              -
                Effect: "Allow"
                Action: "cloudformation:CreateChangeSet"
                Resource:
                  Fn::Sub: "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}/*"
                Condition:
                  StringLike:
                    cloudformation:ChangeSetName: "wpsuite-update-*"
                    cloudformation:TemplateUrl: "https://wpsuite-artifacts-*-*-*.s3.*.amazonaws.com/releases/*/templates/wpsuite-deployment-orchestrator-direct.yaml"
              -
                Effect: "Allow"
                Action:
                  - "cloudformation:DescribeChangeSet"
                  - "cloudformation:DescribeStacks"
                  - "cloudformation:DescribeStackEvents"
                  - "cloudformation:DescribeStackResources"
                  - "cloudformation:GetTemplate"
                Resource:
                  Fn::Sub: "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}/*"
              -
                Effect: "Allow"
                Action: "cloudformation:DeleteChangeSet"
                Resource:
                  Fn::Sub: "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}/*"
                Condition:
                  StringLike:
                    cloudformation:ChangeSetName: "wpsuite-update-*"
              -
                Effect: "Allow"
                Action: "cloudformation:ValidateTemplate"
                Resource: "*"
                Condition:
                  StringLike:
                    cloudformation:TemplateUrl: "https://wpsuite-artifacts-*-*-*.s3.*.amazonaws.com/releases/*/templates/wpsuite-deployment-orchestrator-direct.yaml"
          PolicyName: "WriteDeploymentArtifacts"
      Tags:
        -
          Key: "aws-apn-id"
          Value: "pc:5d8wq5hg1d54kb933ntenntiu"
        -
          Key: "WPSuitePurpose"
          Value: "deployment-artifact-ingress"
  ArtifactStagerFunctionRole:
    Type: "AWS::IAM::Role"
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          -
            Effect: "Allow"
            Principal:
              Service: "lambda.amazonaws.com"
            Action: "sts:AssumeRole"
      Policies:
        -
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              -
                Effect: "Allow"
                Action:
                  - "logs:CreateLogGroup"
                  - "logs:CreateLogStream"
                  - "logs:PutLogEvents"
                  - "logs:PutRetentionPolicy"
                Resource: "*"
          PolicyName: "ArtifactStagerLogs"
        -
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              -
                Effect: "Allow"
                Action:
                  - "s3:ListBucket"
                  - "s3:ListBucketVersions"
                  - "s3:ListBucketMultipartUploads"
                Resource:
                  Fn::Sub:
                    - "arn:${AWS::Partition}:s3:::${Bucket}"
                    -
                      Bucket:
                        Ref: "DeploymentArtifactBucket"
              -
                Effect: "Allow"
                Action:
                  - "s3:DeleteObject"
                  - "s3:DeleteObjectVersion"
                  - "s3:AbortMultipartUpload"
                Resource:
                  Fn::Sub:
                    - "arn:${AWS::Partition}:s3:::${Bucket}/*"
                    -
                      Bucket:
                        Ref: "DeploymentArtifactBucket"
              -
                Effect: "Allow"
                Action:
                  - "s3:GetObject"
                  - "s3:PutObject"
                  - "s3:GetObjectTagging"
                  - "s3:PutObjectTagging"
                Resource:
                  Fn::Sub:
                    - "arn:${AWS::Partition}:s3:::${Bucket}/${Prefix}*"
                    -
                      Bucket:
                        Ref: "DeploymentArtifactBucket"
                      Prefix:
                        Fn::Sub: "wpsuite-artifacts/${AWS::StackId}/"
          PolicyName: "CleanDeploymentArtifactBucket"
      Tags:
        -
          Key: "aws-apn-id"
          Value: "pc:5d8wq5hg1d54kb933ntenntiu"
  ArtifactStagerReadDeploymentSecretPolicy:
    Type: "AWS::IAM::Policy"
    Properties:
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          -
            Effect: "Allow"
            Action:
              - "secretsmanager:GetSecretValue"
            Resource:
              Ref: "WpSuiteDeploymentSecretArn"
      PolicyName: "ReadDeploymentSecret"
      Roles:
        -
          Ref: "ArtifactStagerFunctionRole"
  ArtifactStagerFunction:
    Type: "AWS::Lambda::Function"
    Properties:
      Code:
        ZipFile: "\nconst https = require(\"https\");\nconst url = require(\"url\");\nconst { SecretsManagerClient, GetSecretValueCommand } = require(\"@aws-sdk/client-secrets-manager\");\nconst { CloudWatchLogsClient, PutRetentionPolicyCommand } = require(\"@aws-sdk/client-cloudwatch-logs\");\nconst {\n  S3Client,\n  AbortMultipartUploadCommand,\n  CopyObjectCommand,\n  DeleteObjectsCommand,\n  GetObjectCommand,\n  GetObjectTaggingCommand,\n  ListMultipartUploadsCommand,\n  ListObjectVersionsCommand,\n  ListObjectsV2Command,\n  PutObjectTaggingCommand,\n  PutObjectCommand\n} = require(\"@aws-sdk/client-s3\");\n\nconst logs = new CloudWatchLogsClient({});\nconst s3 = new S3Client({});\n\nfunction logInfo(message, data) {\n  console.info(JSON.stringify({ level: \"INFO\", message, data: data || {} }));\n}\n\nfunction logWarn(message, data) {\n  console.warn(JSON.stringify({ level: \"WARN\", message, data: data || {} }));\n}\n\nfunction logError(message, error, data) {\n  console.error(JSON.stringify({\n    level: \"ERROR\",\n    message,\n    data: data || {},\n    error: {\n      name: error && error.name,\n      message: error && error.message ? error.message : String(error),\n      stack: error && error.stack\n    }\n  }));\n}\n\nasync function configureLogRetention(retentionValue) {\n  const retentionInDays = Number(retentionValue || \"\");\n  if (!Number.isInteger(retentionInDays) || retentionInDays <= 0) {\n    if (retentionValue) {\n      logWarn(\"Skipping invalid ArtifactStager log retention value\", { retentionValue });\n    }\n    return;\n  }\n  const functionName = process.env.AWS_LAMBDA_FUNCTION_NAME;\n  if (!functionName) {\n    logWarn(\"Skipping ArtifactStager log retention because function name is unavailable\");\n    return;\n  }\n  const logGroupName = \"/aws/lambda/\" + functionName;\n  try {\n    await logs.send(new PutRetentionPolicyCommand({ logGroupName, retentionInDays }));\n    logInfo(\"ArtifactStager log retention configured\", { logGroupName, retentionInDays });\n  } catch (error) {\n    logWarn(\"ArtifactStager log retention could not be configured\", {\n      logGroupName,\n      retentionInDays,\n      errorName: error && error.name,\n      errorMessage: error && error.message ? error.message : String(error)\n    });\n  }\n}\n\nfunction requestJson(endpoint, body, timeoutMs = 20000) {\n  return new Promise((resolve, reject) => {\n    const parsed = new url.URL(endpoint);\n    const payload = JSON.stringify(body);\n    const req = https.request({\n      hostname: parsed.hostname,\n      path: parsed.pathname + parsed.search,\n      method: \"POST\",\n      headers: {\n        \"content-type\": \"application/json\",\n        \"content-length\": Buffer.byteLength(payload)\n      }\n    }, (res) => {\n      let data = \"\";\n      res.on(\"data\", (chunk) => { data += chunk; });\n      res.on(\"end\", () => {\n        if (res.statusCode < 200 || res.statusCode >= 300) {\n          let backendCode = \"\";\n          let backendRequestId = \"\";\n          try {\n            const errorBody = JSON.parse(data);\n            if (/^[A-Z][A-Z0-9_]{0,79}$/.test(errorBody.code)) backendCode = errorBody.code;\n            if (/^[a-f0-9-]{36}$/i.test(errorBody.requestId)) backendRequestId = errorBody.requestId;\n          } catch (_) { /* Error bodies may be plain text; never log them. */ }\n          const failure = new Error(\"WP Suite backend returned \" + res.statusCode +\n            (backendCode ? \" (\" + backendCode + \")\" : \"\") +\n            (backendRequestId ? \" requestId=\" + backendRequestId : \"\"));\n          failure.statusCode = res.statusCode;\n          reject(failure);\n          return;\n        }\n        try {\n          resolve(data ? JSON.parse(data) : {});\n        } catch (_) {\n          reject(new Error(\"WP Suite backend returned an invalid staging response\"));\n        }\n      });\n      res.on(\"error\", reject);\n    });\n    req.on(\"error\", reject);\n    if (typeof req.setTimeout === \"function\") {\n      req.setTimeout(timeoutMs, () => {\n        const failure = new Error(\"WP Suite staging HTTP request timed out\");\n        failure.code = \"STAGING_HTTP_TIMEOUT\";\n        req.destroy(failure);\n      });\n    }\n    req.write(payload);\n    req.end();\n  });\n}\n\nasync function waitForArtifactStaging(endpoint, input, context) {\n  // The copy worker has five minutes; leave room for dispatch and status delivery.\n  const remaining = typeof context.getRemainingTimeInMillis === \"function\"\n    ? context.getRemainingTimeInMillis() - 60000 : 360000;\n  const deadline = Date.now() + Math.min(360000, remaining);\n  let stagingJobId;\n  let transientFailures = 0;\n  while (Date.now() < deadline) {\n    let response;\n    try {\n      response = await requestJson(endpoint, {\n        ...input,\n        async: true,\n        ...(stagingJobId ? { stagingJobId } : {})\n      }, Math.min(20000, Math.max(1, deadline - Date.now())));\n      transientFailures = 0;\n    } catch (error) {\n      const transient = error.code === \"STAGING_HTTP_TIMEOUT\" ||\n        [\"ECONNRESET\", \"ETIMEDOUT\", \"EPIPE\"].includes(error.code) ||\n        [502, 503, 504].includes(error.statusCode);\n      // Repeating the same authenticated CFN request joins its durable job.\n      if (!transient) throw error;\n      transientFailures += 1;\n      await new Promise(resolve => setTimeout(resolve,\n        Math.min(5000, transientFailures * 2000, Math.max(0, deadline - Date.now()))));\n      continue;\n    }\n    if (![\"pending\", \"running\"].includes(response.status)) return response;\n    if (!/^stagingjob_[a-f0-9]{64}$/.test(response.stagingJobId || \"\") ||\n        (stagingJobId && response.stagingJobId !== stagingJobId)) {\n      throw new Error(\"WP Suite backend returned an invalid staging job identity\");\n    }\n    stagingJobId = response.stagingJobId;\n    await new Promise(resolve => setTimeout(resolve, Math.min(2000, Math.max(0, deadline - Date.now()))));\n  }\n  throw new Error(\"WP Suite artifact staging did not finish within six minutes\");\n}\n\nfunction sendResponse(event, context, status, data, physicalResourceId, reason) {\n  return new Promise((resolve, reject) => {\n    const body = JSON.stringify({\n      Status: status,\n      Reason: reason || (\"See CloudWatch Log Stream: \" + context.logStreamName),\n      PhysicalResourceId: physicalResourceId || context.logStreamName,\n      StackId: event.StackId,\n      RequestId: event.RequestId,\n      LogicalResourceId: event.LogicalResourceId,\n      NoEcho: false,\n      Data: data || {}\n    });\n    const parsed = new url.URL(event.ResponseURL);\n    const req = https.request({\n      hostname: parsed.hostname,\n      path: parsed.pathname + parsed.search,\n      method: \"PUT\",\n      headers: {\n        \"content-type\": \"\",\n        \"content-length\": Buffer.byteLength(body)\n      }\n    }, (res) => {\n      res.resume();\n      res.on(\"end\", resolve);\n    });\n    req.on(\"error\", reject);\n    req.write(body);\n    req.end();\n  });\n}\n\nasync function deploymentContext(props) {\n  if (props.DeploymentContextMode === \"direct\") {\n    if (!props.DeploymentId || !props.DeploymentNonce) {\n      throw new Error(\"Direct WP Suite deployment context is incomplete\");\n    }\n    return {\n      deploymentId: props.DeploymentId,\n      nonce: props.DeploymentNonce,\n      expectedAwsAccountId: props.ExpectedAwsAccountId || \"\"\n    };\n  }\n\n  if (!props.DeploymentSecretArn) {\n    throw new Error(\"WP Suite deployment secret ARN is missing\");\n  }\n\n  const secrets = new SecretsManagerClient({});\n  const secret = await secrets.send(new GetSecretValueCommand({\n    SecretId: props.DeploymentSecretArn\n  }));\n  if (!secret.SecretString) {\n    throw new Error(\"WP Suite deployment secret is empty\");\n  }\n\n  const parsed = JSON.parse(secret.SecretString);\n  if (!parsed.deploymentId || !parsed.nonce) {\n    throw new Error(\"WP Suite deployment secret is missing required fields\");\n  }\n  return parsed;\n}\n\nasync function deleteObjects(bucketName, objects) {\n  if (!objects.length) {\n    return 0;\n  }\n\n  let deleted = 0;\n  for (let index = 0; index < objects.length; index += 1000) {\n    const batch = objects.slice(index, index + 1000);\n    await s3.send(new DeleteObjectsCommand({\n      Bucket: bucketName,\n      Delete: {\n        Objects: batch,\n        Quiet: true\n      }\n    }));\n    deleted += batch.length;\n  }\n  return deleted;\n}\n\nasync function emptyBucket(bucketName) {\n  if (!bucketName) {\n    logWarn(\"Skipping artifact bucket cleanup because bucket name is missing\");\n    return;\n  }\n\n  try {\n    logInfo(\"ArtifactStager bucket cleanup started\", { bucketName });\n    let deletedObjects = 0;\n    let abortedUploads = 0;\n\n    let continuationToken;\n    do {\n      const response = await s3.send(new ListObjectsV2Command({\n        Bucket: bucketName,\n        ContinuationToken: continuationToken\n      }));\n      const objects = (response.Contents || [])\n        .filter((object) => object.Key)\n        .map((object) => ({ Key: object.Key }));\n      deletedObjects += await deleteObjects(bucketName, objects);\n      continuationToken = response.NextContinuationToken;\n    } while (continuationToken);\n\n    let keyMarker;\n    let versionIdMarker;\n    do {\n      const response = await s3.send(new ListObjectVersionsCommand({\n        Bucket: bucketName,\n        KeyMarker: keyMarker,\n        VersionIdMarker: versionIdMarker\n      }));\n      const versions = [\n        ...(response.Versions || []),\n        ...(response.DeleteMarkers || [])\n      ]\n        .filter((object) => object.Key)\n        .map((object) => ({ Key: object.Key, VersionId: object.VersionId }));\n      deletedObjects += await deleteObjects(bucketName, versions);\n      keyMarker = response.NextKeyMarker;\n      versionIdMarker = response.NextVersionIdMarker;\n    } while (keyMarker);\n\n    let uploadKeyMarker;\n    let uploadIdMarker;\n    do {\n      const response = await s3.send(new ListMultipartUploadsCommand({\n        Bucket: bucketName,\n        KeyMarker: uploadKeyMarker,\n        UploadIdMarker: uploadIdMarker\n      }));\n      for (const upload of response.Uploads || []) {\n        if (!upload.Key || !upload.UploadId) {\n          continue;\n        }\n        await s3.send(new AbortMultipartUploadCommand({\n          Bucket: bucketName,\n          Key: upload.Key,\n          UploadId: upload.UploadId\n        }));\n        abortedUploads += 1;\n      }\n      uploadKeyMarker = response.NextKeyMarker;\n      uploadIdMarker = response.NextUploadIdMarker;\n    } while (uploadKeyMarker);\n\n    logInfo(\"ArtifactStager bucket cleanup completed\", {\n      bucketName,\n      deletedObjects,\n      abortedUploads\n    });\n  } catch (error) {\n    if (error && error.name === \"NoSuchBucket\") {\n      logWarn(\"ArtifactStager bucket cleanup skipped because bucket no longer exists\", { bucketName });\n      return;\n    }\n    throw error;\n  }\n}\n\n\nconst RETENTION_CONTROL = \"_retention/\";\nconst RETENTION_PARALLELISM = 6;\n\nfunction retentionControlKey(stackPrefix, name) {\n  validateStackPrefix(stackPrefix);\n  // Legacy helpers scan and lifecycle-tag every object under wpsuite-artifacts.\n  // Keep durable fences outside that namespace, including during rollback.\n  return stackPrefix.replace(/^wpsuite-artifacts\\//, \"wpsuite-retention/\") + name;\n}\n\nfunction validateStackPrefix(prefix) {\n  if (typeof prefix !== \"string\" || !prefix.startsWith(\"wpsuite-artifacts/\") ||\n      !prefix.endsWith(\"/\") || prefix.includes(\"..\")) throw new Error(\"Invalid retention namespace\");\n  return prefix;\n}\n\nfunction validateArtifactPrefix(prefix, stackPrefix, label) {\n  validateStackPrefix(stackPrefix);\n  if (typeof prefix !== \"string\" || !prefix.endsWith(\"/\") || prefix.includes(\"..\") ||\n      !prefix.startsWith(stackPrefix) || prefix === stackPrefix ||\n      prefix.startsWith(stackPrefix + RETENTION_CONTROL)) {\n    throw new Error(label + \" is outside the deployment artifact namespace\");\n  }\n  return prefix;\n}\n\nfunction isMissing(error) {\n  return [\"NoSuchKey\", \"NotFound\"].includes(error && error.name) ||\n    (error && error.$metadata && error.$metadata.httpStatusCode === 404);\n}\nfunction isConditionalConflict(error) {\n  return [\"PreconditionFailed\", \"ConditionalRequestConflict\"].includes(error && error.name) ||\n    (error && error.$metadata && [409, 412].includes(error.$metadata.httpStatusCode));\n}\n\nasync function readRetentionJson(bucket, key, abortSignal) {\n  try {\n    const response = await s3.send(new GetObjectCommand({ Bucket: bucket, Key: key }), { abortSignal });\n    if (!response.ETag || !response.Body) throw new Error(\"Incomplete retention control object\");\n    const raw = await response.Body.transformToString();\n    if (Buffer.byteLength(raw) > 1048576) throw new Error(\"Retention control object exceeds limit\");\n    return { value: JSON.parse(raw), etag: response.ETag };\n  } catch (error) { if (isMissing(error)) return null; throw error; }\n}\n\nasync function writeRetentionJson(bucket, key, value, condition, abortSignal) {\n  // Every control revision has a distinct ETag, even if its logical state is\n  // unchanged. A delayed conditional write must never pass an ABA comparison.\n  const body = JSON.stringify({ ...value, writeRevision: require(\"crypto\").randomUUID() });\n  if (Buffer.byteLength(body) > 1048576) throw new Error(\"Retention control object exceeds limit\");\n  const result = await s3.send(new PutObjectCommand({ Bucket: bucket, Key: key,\n    Body: body, ContentType: \"application/json\", ServerSideEncryption: \"AES256\", ...condition }), { abortSignal });\n  if (!result.ETag) throw new Error(\"Missing conditional-write ETag\");\n  return result.ETag;\n}\n\nasync function acquireRetentionLease(bucket, stackPrefix, context, wait, abortSignal) {\n  validateStackPrefix(stackPrefix);\n  const key = retentionControlKey(stackPrefix, \"lease.json\");\n  const remaining = () => typeof context.getRemainingTimeInMillis === \"function\"\n    ? context.getRemainingTimeInMillis() : 900000;\n  const deadline = Date.now() + Math.max(0, remaining() - 60000);\n  const holder = require(\"crypto\").randomUUID();\n  do {\n    const current = await readRetentionJson(bucket, key, abortSignal);\n    if (current && (!Number.isSafeInteger(current.value.expiresAt) || typeof current.value.holder !== \"string\")) {\n      throw new Error(\"Invalid retention lease\");\n    }\n    if (!current || current.value.expiresAt <= Date.now()) {\n      // A crashed holder cannot still be running when this lease expires:\n      // its actual Lambda hard deadline plus a thirty-second safety margin.\n      const value = { holder, expiresAt: Date.now() + remaining() + 30000 };\n      try {\n        const etag = await writeRetentionJson(bucket, key, value,\n          current ? { IfMatch: current.etag } : { IfNoneMatch: \"*\" }, abortSignal);\n        return { bucket, key, etag, holder, expiresAt: value.expiresAt, abortSignal };\n      } catch (error) { if (!isConditionalConflict(error)) throw error; }\n    }\n    if (!wait) return null;\n    await new Promise(resolve => setTimeout(resolve, 500));\n  } while (Date.now() < deadline);\n  throw new Error(\"Artifact retention is busy; retry the stack operation\");\n}\n\nasync function assertRetentionLease(lease) {\n  if (Date.now() >= lease.expiresAt - 10000) throw new Error(\"Retention lease deadline reached\");\n  const current = await readRetentionJson(lease.bucket, lease.key, lease.abortSignal);\n  if (!current || current.etag !== lease.etag || current.value.holder !== lease.holder) {\n    throw new Error(\"Retention lease changed\");\n  }\n}\n\nasync function releaseRetentionLease(lease) {\n  // Conditional tombstone avoids relying on newer DeleteObject IfMatch suppo