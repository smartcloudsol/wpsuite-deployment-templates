        ZipFile: "\nconst { S3Client, GetObjectCommand, PutObjectCommand, ListObjectsV2Command,\n  GetObjectTaggingCommand, PutObjectTaggingCommand, CopyObjectCommand } = require(\"@aws-sdk/client-s3\");\n// An SDK retry could mask an ambiguous earlier mutation. Keep the fence on\n// every failed physical attempt instead of converting it into a later success.\nconst s3 = new S3Client({ maxAttempts: 1 });\nfunction logInfo(message, data) { console.info(JSON.stringify({ level: \"INFO\", message, data: data || {} })); }\n\nconst RETENTION_CONTROL = \"_retention/\";\nconst RETENTION_PARALLELISM = 6;\n\nfunction retentionControlKey(stackPrefix, name) {\n  validateStackPrefix(stackPrefix);\n  // Legacy helpers scan and lifecycle-tag every object under wpsuite-artifacts.\n  // Keep durable fences outside that namespace, including during rollback.\n  return stackPrefix.replace(/^wpsuite-artifacts\\//, \"wpsuite-retention/\") + name;\n}\n\nfunction validateStackPrefix(prefix) {\n  if (typeof prefix !== \"string\" || !prefix.startsWith(\"wpsuite-artifacts/\") ||\n      !prefix.endsWith(\"/\") || prefix.includes(\"..\")) throw new Error(\"Invalid retention namespace\");\n  return prefix;\n}\n\nfunction validateArtifactPrefix(prefix, stackPrefix, label) {\n  validateStackPrefix(stackPrefix);\n  if (typeof prefix !== \"string\" || !prefix.endsWith(\"/\") || prefix.includes(\"..\") ||\n      !prefix.startsWith(stackPrefix) || prefix === stackPrefix ||\n      prefix.startsWith(stackPrefix + RETENTION_CONTROL)) {\n    throw new Error(label + \" is outside the deployment artifact namespace\");\n  }\n  return prefix;\n}\n\nfunction isMissing(error) {\n  return [\"NoSuchKey\", \"NotFound\"].includes(error && error.name) ||\n    (error && error.$metadata && error.$metadata.httpStatusCode === 404);\n}\nfunction isConditionalConflict(error) {\n  return [\"PreconditionFailed\", \"ConditionalRequestConflict\"].includes(error && error.name) ||\n    (error && error.$metadata && [409, 412].includes(error.$metadata.httpStatusCode));\n}\n\nasync function readRetentionJson(bucket, key, abortSignal) {\n  try {\n    const response = await s3.send(new GetObjectCommand({ Bucket: bucket, Key: key }), { abortSignal });\n    if (!response.ETag || !response.Body) throw new Error(\"Incomplete retention control object\");\n    const raw = await response.Body.transformToString();\n    if (Buffer.byteLength(raw) > 1048576) throw new Error(\"Retention control object exceeds limit\");\n    return { value: JSON.parse(raw), etag: response.ETag };\n  } catch (error) { if (isMissing(error)) return null; throw error; }\n}\n\nasync function writeRetentionJson(bucket, key, value, condition, abortSignal) {\n  // Every control revision has a distinct ETag, even if its logical state is\n  // unchanged. A delayed conditional write must never pass an ABA comparison.\n  const body = JSON.stringify({ ...value, writeRevision: require(\"crypto\").randomUUID() });\n  if (Buffer.byteLength(body) > 1048576) throw new Error(\"Retention control object exceeds limit\");\n  const result = await s3.send(new PutObjectCommand({ Bucket: bucket, Key: key,\n    Body: body, ContentType: \"application/json\", ServerSideEncryption: \"AES256\", ...condition }), { abortSignal });\n  if (!result.ETag) throw new Error(\"Missing conditional-write ETag\");\n  return result.ETag;\n}\n\nasync function acquireRetentionLease(bucket, stackPrefix, context, wait, abortSignal) {\n  validateStackPrefix(stackPrefix);\n  const key = retentionControlKey(stackPrefix, \"lease.json\");\n  const remaining = () => typeof context.getRemainingTimeInMillis === \"function\"\n    ? context.getRemainingTimeInMillis() : 900000;\n  const deadline = Date.now() + Math.max(0, remaining() - 60000);\n  const holder = require(\"crypto\").randomUUID();\n  do {\n    const current = await readRetentionJson(bucket, key, abortSignal);\n    if (current && (!Number.isSafeInteger(current.value.expiresAt) || typeof current.value.holder !== \"string\")) {\n      throw new Error(\"Invalid retention lease\");\n    }\n    if (!current || current.value.expiresAt <= Date.now()) {\n      // A crashed holder cannot still be running when this lease expires:\n      // its actual Lambda hard deadline plus a thirty-second safety margin.\n      const value = { holder, expiresAt: Date.now() + remaining() + 30000 };\n      try {\n        const etag = await writeRetentionJson(bucket, key, value,\n          current ? { IfMatch: current.etag } : { IfNoneMatch: \"*\" }, abortSignal);\n        return { bucket, key, etag, holder, expiresAt: value.expiresAt, abortSignal };\n      } catch (error) { if (!isConditionalConflict(error)) throw error; }\n    }\n    if (!wait) return null;\n    await new Promise(resolve => setTimeout(resolve, 500));\n  } while (Date.now() < deadline);\n  throw new Error(\"Artifact retention is busy; retry the stack operation\");\n}\n\nasync function assertRetentionLease(lease) {\n  if (Date.now() >= lease.expiresAt - 10000) throw new Error(\"Retention lease deadline reached\");\n  const current = await readRetentionJson(lease.bucket, lease.key, lease.abortSignal);\n  if (!current || current.etag !== lease.etag || current.value.holder !== lease.holder) {\n    throw new Error(\"Retention lease changed\");\n  }\n}\n\nasync function releaseRetentionLease(lease) {\n  // Conditional tombstone avoids relying on newer DeleteObject IfMatch support.\n  await writeRetentionJson(lease.bucket, lease.key, { holder: \"\", expiresAt: 0 },\n    { IfMatch: lease.etag }, AbortSignal.timeout(5000));\n}\n\nasync function retentionPool(items, operation) {\n  let index = 0;\n  let failure;\n  await Promise.all(Array.from({ length: Math.min(RETENTION_PARALLELISM, items.length) }, async () => {\n    while (!failure && index < items.length) {\n      const item = items[index++];\n      try { await operation(item); } catch (error) { failure = failure || error; }\n    }\n  }));\n  // All started S3 requests have settled before releasing the shared lease.\n  if (failure) throw failure;\n}\n\nasync function setArtifactRetention(bucketName, key, retention, lease) {\n  const current = await s3.send(new GetObjectTaggingCommand({ Bucket: bucketName, Key: key }), { abortSignal: lease.abortSignal });\n  if ((current.TagSet || []).some(tag => tag.Key === \"wpsuite-artifact-retention\" && tag.Value === retention)) return;\n  const tagSet = (current.TagSet || []).filter(tag => tag.Key !== \"wpsuite-artifact-retention\");\n  tagSet.push({ Key: \"wpsuite-artifact-retention\", Value: retention });\n  await assertRetentionLease(lease);\n  if (lease.beforeMutation) await lease.beforeMutation();\n  if (retention === \"cleanup-eligible\") {\n    // Start the thirty-day grace period at first demotion, not at original upload.\n    await s3.send(new CopyObjectCommand({ Bucket: bucketName, Key: key,\n      CopySource: encodeURIComponent(bucketName + \"/\" + key).replace(/%2F/g, \"/\"),\n      MetadataDirective: \"COPY\", TaggingDirective: \"REPLACE\",\n      Tagging: tagSet.map(tag => encodeURIComponent(tag.Key) + \"=\" + encodeURIComponent(tag.Value)).join(\"&\") }), { abortSignal: lease.abortSignal });\n  } else {\n    await s3.send(new PutObjectTaggingCommand({ Bucket: bucketName, Key: key, Tagging: { TagSet: tagSet } }), { abortSignal: lease.abortSignal });\n  }\n}\n\nfunction validateRetentionState(state, stackPrefix) {\n  if (!state || state.schemaVersion !== 1 || !Array.isArray(state.protectedPrefixes) ||\n      state.protectedPrefixes.length < 1 || state.protectedPrefixes.length > 2 ||\n      !Array.isArray(state.completedPrefixes) || state.completedPrefixes.length > 10000) {\n    throw new Error(\"Invalid retention state\");\n  }\n  for (const prefix of [...state.protectedPrefixes, ...state.completedPrefixes]) validateArtifactPrefix(prefix, stackPrefix, \"Retention prefix\");\n  if (state.quarantinedPrefixes !== undefined && (!Array.isArray(state.quarantinedPrefixes) || state.quarantinedPrefixes.length > 10000)) {\n    throw new Error(\"Invalid retention quarantine\");\n  }\n  for (const prefix of state.quarantinedPrefixes || []) validateArtifactPrefix(prefix, stackPrefix, \"Quarantined prefix\");\n  if (state.pending) {\n    validateArtifactPrefix(state.pending.prefix, stackPrefix, \"Pending prefix\");\n    if (state.pending.token !== undefined && (typeof state.pending.token !== \"string\" || state.pending.token.length > 16384)) throw new Error(\"Invalid retention cursor\");\n  }\n  return state;\n}\n\nfunction assertNoQuarantinedGeneration(state, prefixes) {\n  const quarantined = new Set(state.quarantinedPrefixes || []);\n  const requested = [...prefixes];\n  if (prefixes.length === 1 && state.protectedPrefixes[0] === prefixes[0] && state.protectedPrefixes[1]) requested.push(state.protectedPrefixes[1]);\n  if (requested.some(prefix => quarantined.has(prefix))) {\n    throw new Error(\"ARTIFACT_GENERATION_QUARANTINED: a previous cleanup write has an uncertain outcome; use a different release generation\");\n  }\n}\n\nasync function assertArtifactGenerationsAvailable(bucket, stackPrefix, prefixes) {\n  const targets = prefixes.map(prefix => validateArtifactPrefix(prefix, stackPrefix, \"Requested prefix\"));\n  const stored = await readRetentionJson(bucket, retentionControlKey(stackPrefix, \"state.json\"));\n  if (stored) assertNoQuarantinedGeneration(validateRetentionState(stored.value, stackPrefix), targets);\n}\n\nasync function protectArtifactGenerations(bucket, stackPrefix, prefixes, lease) {\n  const protectedPrefixes = [...new Set(prefixes.map(prefix => validateArtifactPrefix(prefix, stackPrefix, \"Protected prefix\")))];\n  if (protectedPrefixes.length < 1 || protectedPrefixes.length > 2) throw new Error(\"Invalid protected generation count\");\n  const key = retentionControlKey(stackPrefix, \"state.json\");\n  const stored = await readRetentionJson(bucket, key);\n  const previous = stored ? validateRetentionState(stored.value, stackPrefix) : { completedPrefixes: [] };\n  if (stored) assertNoQuarantinedGeneration(previous, protectedPrefixes);\n  // A configuration-only update does not replace the previous distinct release.\n  if (protectedPrefixes.length === 1 && previous.protectedPrefixes &&\n      previous.protectedPrefixes[0] === protectedPrefixes[0] && previous.protectedPrefixes[1]) {\n    protectedPrefixes.push(previous.protectedPrefixes[1]);\n  }\n  for (const prefix of protectedPrefixes) {\n    let token;\n    do {\n      const page = await s3.send(new ListObjectsV2Command({ Bucket: bucket, Prefix: prefix, ContinuationToken: token }));\n      await retentionPool((page.Contents || []).filter(object => object.Key).map(object => object.Key),\n        key => setArtifactRetention(bucket, key, \"protected\", lease));\n      token = page.NextContinuationToken;\n    } while (token);\n  }\n  await assertRetentionLease(lease);\n  const state = { schemaVersion: 1, protectedPrefixes,\n    completedPrefixes: previous.completedPrefixes.filter(prefix => !protectedPrefixes.includes(prefix)),\n    quarantinedPrefixes: previous.quarantinedPrefixes || [] };\n  await writeRetentionJson(bucket, key, state, stored ? { IfMatch: stored.etag } : { IfNoneMatch: \"*\" });\n  logInfo(\"Current and previous artifact generations protected\", { protectedPrefixes });\n}\n\nasync function maintainArtifactRetention(bucket, stackPrefix, context) {\n  const controller = new AbortController();\n  const remaining = typeof context.getRemainingTimeInMillis === \"function\" ? context.getRemainingTimeInMillis() : 60000;\n  const budget = Math.min(10000, remaining - 15000);\n  if (budget <= 0) return;\n  const timer = setTimeout(() => controller.abort(), budget);\n  let lease;\n  try {\n    lease = await acquireRetentionLease(bucket, stackPrefix, context, false, controller.signal);\n    if (!lease) { logInfo(\"Artifact retention deferred while staging is active\"); return; }\n    const stateKey = retentionControlKey(stackPrefix, \"state.json\");\n    const stored = await readRetentionJson(bucket, stateKey, controller.signal);\n    if (!stored) return;\n    const state = validateRetentionState(stored.value, stackPrefix);\n    const protectedSet = new Set(state.protectedPrefixes);\n    const completedSet = new Set(state.completedPrefixes);\n    const quarantinedSet = new Set(state.quarantinedPrefixes || []);\n    let prefix = state.pending && !protectedSet.has(state.pending.prefix) && !quarantinedSet.has(state.pending.prefix) ? state.pending.prefix : null;\n    let token = prefix ? state.pending.token : undefined;\n    if (!prefix) {\n      let discoveryToken;\n      do {\n        const page = await s3.send(new ListObjectsV2Command({ Bucket: bucket, Prefix: stackPrefix,\n          Delimiter: \"/\", MaxKeys: 1000, ContinuationToken: discoveryToken }), { abortSignal: controller.signal });\n        const candidate = (page.CommonPrefixes || []).map(item => item.Prefix)\n          .find(item => item && item !== stackPrefix + RETENTION_CONTROL && !protectedSet.has(item) && !completedSet.has(item) && !quarantinedSet.has(item));\n        if (candidate) { prefix = validateArtifactPrefix(candidate, stackPrefix, \"Discovered prefix\"); break; }\n        discoveryToken = page.NextContinuationToken;\n      } while (discoveryToken);\n    }\n    if (!prefix) return;\n    const page = await s3.send(new ListObjectsV2Command({ Bucket: bucket, Prefix: prefix,\n      MaxKeys: 24, ContinuationToken: token }), { abortSignal: controller.signal });\n    const keys = (page.Contents || []).filter(object => object.Key).map(object => {\n      if (!object.Key.startsWith(prefix)) throw new Error(\"Object outside retention generation\");\n      return object.Key;\n    });\n    let intent;\n    lease.beforeMutation = () => {\n      if (!intent) intent = (async () => {\n        // The acknowledged intent is the fence, not the client's RPC lifetime.\n        // A lost response can leave a server-side write running after abort.\n        state.quarantinedPrefixes = [...new Set([...(state.quarantinedPrefixes || []), prefix])];\n        stored.etag = await writeRetentionJson(bucket, stateKey, state, { IfMatch: stored.etag }, controller.signal);\n      })();\n      return intent;\n    };\n    await retentionPool(keys, key => setArtifactRetention(bucket, key, \"cleanup-eligible\", lease));\n    await assertRetentionLease(lease);\n    // Only successful, non-retried mutation responses permit removing the fence.\n    // On any uncertain result it remains indefinitely, blocking re-promotion.\n    if (intent) state.quarantinedPrefixes = state.quarantinedPrefixes.filter(value => value !== prefix);\n    if (page.NextContinuationToken) state.pending = { prefix, token: page.NextContinuationToken };\n    else {\n      completedSet.add(prefix);\n      state.completedPrefixes = [...completedSet];\n      delete state.pending;\n    }\n    await writeRetentionJson(bucket, stateKey, state, { IfMatch: stored.etag }, controller.signal);\n    logInfo(\"Artifact retention background page completed\", { prefix, objects: keys.length, complete: !page.NextContinuationToken });\n  } catch (error) {\n    if (!controller.signal.aborted) throw error;\n    logInfo(\"Artifact retention page deferred at its time budget\");\n  } finally {\n    clearTimeout(timer);\n    if (lease) await releaseRetentionLease(lease);\n  }\n}\n\nexports.handler = async (_event, context) => {\n  const bucket = process.env.ARTIFACT_BUCKET;\n  const prefix = validateStackPrefix(process.env.ARTIFACT_STACK_PREFIX);\n  if (!bucket) throw new Error(\"Missing artifact retention bucket\");\n  await maintainArtifactRetention(bucket, prefix, context);\n};\n"
