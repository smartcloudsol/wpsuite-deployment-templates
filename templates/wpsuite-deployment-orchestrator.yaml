                  - "ArtifactStagerFunction"
                  - "Arn"
              -
                Fn::GetAtt:
                  - "ArtifactRetentionFunction"
                  - "Arn"
              -
                Fn::GetAtt:
                  - "DeploymentOutputReporterFunction"
                  - "Arn"
          -
            Effect: "Allow"
            Action:
              - "cloudformation:DescribeStacks"
              - "cloudformation:GetStackPolicy"
              - "cloudformation:GetTemplate"
            Resource:
              -
                Ref: "AWS::StackId"
              -
                Ref: "CognitoNestedStack"
              -
                Ref: "FlowBackendNestedStack"
              -
                Ref: "AiKitBackendNestedStack"
              -
                Ref: "StaticGuardianNestedStack"
              -
                Ref: "DrBackupNestedStack"
          -
            Effect: "Allow"
            Action:
              - "s3:GetAccelerateConfiguration"
              - "s3:GetLifecycleConfiguration"
              - "s3:GetBucketPublicAccessBlock"
              - "s3:GetAnalyticsConfiguration"
              - "s3:GetBucketCORS"
              - "s3:GetEncryptionConfiguration"
              - "s3:GetInventoryConfiguration"
              - "s3:GetBucketLogging"
              - "s3:GetMetricsConfiguration"
              - "s3:GetBucketNotification"
              - "s3:GetBucketVersioning"
              - "s3:GetReplicationConfiguration"
              - "s3:GetBucketWebsite"
              - "s3:GetBucketObjectLockConfiguration"
              - "s3:GetBucketTagging"
              - "s3:ListTagsForResource"
              - "s3:GetBucketAbac"
              - "s3:GetBucketOwnershipControls"
              - "s3:GetIntelligentTieringConfiguration"
              - "s3:GetBucketMetadataTableConfiguration"
              - "s3:ListBucket"
              - "s3:GetBucketPolicy"
            Resource:
              Fn::GetAtt:
                - "DeploymentArtifactBucket"
                - "Arn"
          -
            Effect: "Allow"
            Action:
              - "events:DescribeRule"
              - "events:ListTargetsByRule"
              - "events:ListTagsForResource"
            Resource:
              Fn::Sub: "arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/${AWS::StackName}-artifact-gc"
          -
            Effect: "Allow"
            Action:
              - "logs:GetDataProtectionPolicy"
              - "logs:ListTagsForResource"
            Resource:
              -
                Fn::Sub: "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-artifact-gc"
              -
                Fn::Sub: "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-artifact-gc:*"
          -
            Effect: "Allow"
            Action:
              - "logs:DescribeLogGroups"
              - "logs:DescribeResourcePolicies"
              - "logs:DescribeIndexPolicies"
            Resource: "*"
            Condition:
              StringEquals:
                aws:RequestedRegion:
                  Ref: "AWS::Region"
      PolicyName: "ReadOwnRoleForChangeSetPreview"
      Roles:
        -
          Ref: "ArtifactIngressRole"
Outputs:
  PrmProductCode:
    Description: "AWS Marketplace product code used for WP Suite Deployment Access PRM attribution."
    Value:
      Fn::FindInMap:
        - "WpSuiteMarketplace"
        - "DeploymentAccess"
        - "ProductCode"
  ArtifactBucketName:
    Description: "Buyer-owned bucket that contains staged WP Suite deployment artifacts."
    Value:
      Ref: "DeploymentArtifactBucket"
  ArtifactRootPrefix:
    Description: "S3 prefix that contains staged WP Suite deployment artifacts."
    Value:
      Fn::GetAtt:
        - "ArtifactStager"
        - "ArtifactRootPrefix"
  ArtifactIngressRoleArn:
    Description: "Buyer-account role used by WP Suite to prepare deployment update change sets."
    Value:
      Fn::GetAtt:
        - "ArtifactIngressRole"
        - "Arn"
  DeploymentControlProtocolVersion:
    Description: "WP Suite deployment update control protocol supported by this stack."
    Value: "2"
  TemplateVersion:
    Description: "WP Suite template version used by this deployment."
    Value:
      Fn::GetAtt:
        - "ArtifactStager"
        - "TemplateVersion"
  AgentComposerMcpOAuthClientId:
    Description: "Optional public Cognito app client ID created for Agent Composer MCP OAuth."
    Value:
      Fn::GetAtt:
        - "CognitoNestedStack"
        - "Outputs.AgentComposerMcpOAuthClientId"
  AgentComposerMcpResourceUri:
    Description: "External MCP resource URI bound to the optional Agent Composer OAuth client."
    Value:
      Fn::GetAtt:
        - "CognitoNestedStack"
        - "Outputs.AgentComposerMcpResourceUri"
  IdentityEventBusArn:
    Description: "Optional identity lifecycle EventBridge bus ARN; empty when disabled."
    Value:
      Fn::GetAtt:
        - "CognitoNestedStack"
        - "Outputs.IdentityEventBusArn"
  IdentityExtensionContractVersion:
    Description: "Version of the optional identity integration contract."
    Value: "1"
  IdentityDeploymentId:
    Description: "Root stack ARN binding the optional identity integration."
    Value:
      Fn::GetAtt:
        - "CognitoNestedStack"
        - "Outputs.IdentityDeploymentId"
  DeploymentOutputCaptureId:
    Description: "Hash of the captured WP Suite deployment outputs."
    Value:
      Fn::GetAtt:
        - "DeploymentOutputReporter"
        - "OutputsHash"
