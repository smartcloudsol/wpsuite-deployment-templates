        Ref: "Api"
      StageName: "$default"
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 50
        ThrottlingRateLimit: 25
    DependsOn:
      - "ApiPermission"
    Condition: "CommerceEnabled"
  ApiPermission:
    Type: "AWS::Lambda::Permission"
    Properties:
      Action: "lambda:InvokeFunction"
      FunctionName:
        Fn::GetAtt:
          - "Runtime"
          - "Arn"
      Principal: "apigateway.amazonaws.com"
      SourceArn:
        Fn::Sub: "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${Api}/*"
    Condition: "CommerceEnabled"
  QueueAgeAlarm:
    Type: "AWS::CloudWatch::Alarm"
    Properties:
      Namespace: "AWS/SQS"
      MetricName: "ApproximateAgeOfOldestMessage"
      Dimensions:
        -
          Name: "QueueName"
          Value:
            Fn::GetAtt:
              - "EventQueue"
              - "QueueName"
      Statistic: "Maximum"
      Period: 60
      EvaluationPeriods: 1
      Threshold: 180
      ComparisonOperator: "GreaterThanOrEqualToThreshold"
      TreatMissingData: "notBreaching"
    Condition: "CommerceEnabled"
  DeadLetterAlarm:
    Type: "AWS::CloudWatch::Alarm"
    Properties:
      Namespace: "AWS/SQS"
      MetricName: "ApproximateNumberOfMessagesVisible"
      Dimensions:
        -
          Name: "QueueName"
          Value:
            Fn::GetAtt:
              - "DeadLetterQueue"
              - "QueueName"
      Statistic: "Maximum"
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: "GreaterThanOrEqualToThreshold"
      TreatMissingData: "notBreaching"
    Condition: "CommerceEnabled"
  RuntimeErrorsAlarm:
