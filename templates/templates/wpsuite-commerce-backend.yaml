    Properties:
      Namespace: "AWS/Lambda"
      MetricName: "Errors"
      Dimensions:
        -
          Name: "FunctionName"
          Value:
            Ref: "Runtime"
      Statistic: "Maximum"
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: "GreaterThanOrEqualToThreshold"
      TreatMissingData: "notBreaching"
    Condition: "CommerceEnabled"
Outputs:
  PrmProductCode:
    Description: "AWS Marketplace product code used for WP Suite Deployment Access PRM attribution."
    Value:
      Fn::FindInMap:
        - "WpSuiteMarketplace"
        - "DeploymentAccess"
        - "ProductCode"
  ApiUrl:
    Description: "Commerce ApiUrl."
    Value:
      Fn::GetAtt:
        - "Api"
        - "ApiEndpoint"
    Condition: "CommerceEnabled"
  EventBusName:
    Description: "Commerce EventBusName."
    Value:
      Ref: "CommerceEventBus"
    Condition: "CommerceEnabled"
  TableName:
    Description: "Commerce TableName."
    Value:
      Ref: "CommerceState"
    Condition: "CommerceEnabled"
  ContractVersion:
    Description: "Commerce ContractVersion."
    Value: "1"
    Condition: "CommerceEnabled"
  GroupClaimsMode:
    Description: "Commerce GroupClaimsMode."
    Value: "existing-sc.group"
    Condition: "CommerceEnabled"
  RuntimeRoleArn:
    Description: "Commerce RuntimeRoleArn."
    Value:
      Fn::GetAtt:
        - "RuntimeRole"
        - "Arn"
    Condition: "CommerceEnabled"
  StripePartnerEventBusName:
    Description: "Commerce StripePartnerEventBusName."
    Value:
      Ref: "StripePartnerEventBusName"
    Condition: "CommerceEnabled"
  StripeEventSource:
    Description: "Commerce StripeEventSource."
    Value:
      Fn::If:
        - "HasStripeEventSource"
        -
          Ref: "StripeEventSource"
        -
          Ref: "StripePartnerEventBusName"
    Condition: "CommerceEnabled"
  StripeEventRuleArn:
    Description: "Commerce StripeEventRuleArn."
    Value:
      Fn::GetAtt:
        - "StripeRule"
        - "Arn"
    Condition: "CommerceEnabled"
