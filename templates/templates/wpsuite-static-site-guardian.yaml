        Ref: "LogRetentionDays"
      Tags:
        -
          Key: "aws-apn-id"
          Value:
            Ref: "PrmTagValue"
    Condition: "LicenseRefreshFunctionLogGroupTemplateEnabledCondition"
  LicenseRefreshScheduleGroup:
    Type: "AWS::Scheduler::ScheduleGroup"
    Properties:
      Tags:
        -
          Key: "aws-apn-id"
          Value:
            Ref: "PrmTagValue"
    Condition: "LicenseRefreshScheduleGroupTemplateEnabledCondition"
  LicenseRefreshSchedulerExecutionRole:
    Type: "AWS::IAM::Role"
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          -
            Effect: "Allow"
            Principal:
              Service: "scheduler.amazonaws.com"
            Action: "sts:AssumeRole"
            Condition:
              StringEquals:
                aws:SourceAccount:
                  Ref: "AWS::AccountId"
              ArnEquals:
                aws:SourceArn:
                  Fn::GetAtt:
                    - "LicenseRefreshScheduleGroup"
                    - "Arn"
      Policies:
        -
          PolicyName: "LicenseRefreshSchedulerInvokePolicy"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              -
                Effect: "Allow"
                Action:
                  - "lambda:InvokeFunction"
                Resource:
                  Fn::GetAtt:
                    - "LicenseRefreshFunction"
                    - "Arn"
      Tags:
        -
          Key: "aws-apn-id"
          Value:
            Ref: "PrmTagValue"
    Condition: "LicenseRefreshSchedulerExecutionRoleTemplateEnabledCondition"
  LicenseRefreshSchedulerSchedule:
    Type: "AWS::Scheduler::Schedule"
    Properties:
      Description: "Weekly WP Suite site config refresh schedule"
      GroupName:
        Ref: "LicenseRefreshScheduleGroup"
      ScheduleExpression:
        Ref: "LicenseRefreshScheduleExpression"
      ScheduleExpressionTimezone: "UTC"
      FlexibleTimeWindow:
        Mode: "OFF"
      State: "ENABLED"
      Target:
        Arn:
          Fn::GetAtt:
            - "LicenseRefreshFunction"
            - "Arn"
        RoleArn:
          Fn::GetAtt:
            - "LicenseRefreshSchedulerExecutionRole"
            - "Arn"
        Input: "{}"
        RetryPolicy:
          MaximumEventAgeInSeconds: 3600
          MaximumRetryAttempts: 3
    Condition: "LicenseRefreshSchedulerScheduleTemplateEnabledCondition"
