    Properties:
      HostedZoneId:
        Fn::GetAtt:
          - "HostedZoneLookup"
          - "HostedZoneId"
      Name:
        Ref: "DomainName"
      Type: "A"
      AliasTarget:
        DNSName:
          Fn::GetAtt:
            - "CloudFrontDistribution"
            - "DomainName"
        HostedZoneId: "Z2FDTNDATAQYW2"
    Condition: "ApexDNSRecordTemplateEnabledCondition"
  MonitoringDashboard:
    Type: "AWS::CloudWatch::Dashboard"
    Properties:
      DashboardName:
        Fn::Sub: "${AppName}-monitoring"
      DashboardBody:
        Fn::Sub: "{\n  \"widgets\": [\n    {\n      \"type\": \"metric\",\n      \"x\": 0,\n      \"y\": 0,\n      \"width\": 12,\n      \"height\": 6,\n      \"properties\": {\n        \"metrics\": [\n          [\n            \"AWS/Lambda\",\n            \"Invocations\",\n            \"FunctionName\",\n            \"${AppName}-cookie-signing\"\n          ],\n          [\n            \".\",\n            \"Errors\",\n            \".\",\n            \".\"\n          ],\n          [\n            \".\",\n            \"Duration\",\n            \".\",\n            \".\"\n          ]\n        ],\n        \"period\": 300,\n        \"stat\": \"Sum\",\n        \"region\": \"us-east-1\",\n        \"title\": \"Lambda@Edge Function Metrics (us-east-1)\"\n      }\n    },\n    {\n      \"type\": \"metric\",\n      \"x\": 12,\n      \"y\": 0,\n      \"width\": 12,\n      \"height\": 6,\n      \"properties\": {\n        \"metrics\": [\n          [\n            \"AWS/CloudFront\",\n            \"Requests\",\n            \"DistributionId\",\n            \"${CloudFrontDistribution}\"\n          ],\n          [\n            \".\",\n            \"BytesDownloaded\",\n            \".\",\n            \".\"\n          ],\n          [\n            \".\",\n            \"4xxErrorRate\",\n            \".\",\n            \".\"\n          ],\n          [\n            \".\",\n            \"5xxErrorRate\",\n            \".\",\n            \".\"\n          ]\n        ],\n        \"period\": 300,\n        \"stat\": \"Sum\",\n        \"region\": \"${AWS::Region}\",\n        \"title\": \"CloudFront Distribution Metrics\"\n      }\n    },\n    {\n      \"type\": \"log\",\n      \"x\": 0,\n      \"y\": 6,\n      \"width\": 24,\n      \"height\": 6,\n      \"properties\": {\n        \"query\": \"SOURCE '/aws/lambda/us-east-1.${AppName}-cookie-signing'\\n| fields @timestamp, @message\\n| filter @message like /ERROR/\\n| sort @timestamp desc\\n| limit 100\",\n        \"region\": \"us-east-1\",\n        \"title\": \"Lambda@Edge Error Logs\",\n        \"view\": \"table\"\n      }\n    }\n  ]\n}"
    Condition: "MonitoringDashboardTemplateEnabledCondition"
Outputs:
  PrmProductCode:
    Description: "AWS Marketplace product code used for WP Suite Deployment Access PRM attribution."
    Value:
      Fn::FindInMap:
        - "WpSuiteMarketplace"
        - "DeploymentAccess"
        - "ProductCode"
  TemplateFamily:
    Description: "Template family identifier."
    Value: "wpsuite-static-site-guardian"
  TemplateVersion:
    Description: "Template version used for this nested stack."
    Value:
      Ref: "TemplateVersion"
  S3BucketName:
    Description: "S3 Bucket name for static site hosting."
    Value:
      Fn::If:
        - "TemplateEnabled"
        -
          Ref: "StaticSiteBucket"
        - ""
  S3BucketUrl:
    Description: "S3 Bucket URL for static site hosting."
    Value:
      Fn::If:
        - "TemplateEnabled"
        -
          Fn::Sub: "https://${StaticSiteBucket}.s3.${AWS::Region}.amazonaws.com"
        - ""
  CloudFrontDistributionId:
    Description: "CloudFront Distribution ID."
    Value:
      Fn::If:
        - "TemplateEnabled"
        -
          Ref: "CloudFrontDistribution"
        - ""
  CloudFrontDistributionDomain:
    Description: "CloudFront Distribution Domain Name."
    Value:
      Fn::If:
        - "TemplateEnabled"
        -
          Fn::GetAtt:
            - "CloudFrontDistribution"
            - "DomainName"
        - ""
  LambdaEdgeFunctionArn:
    Description: "Lambda@Edge Function ARN."
    Value:
      Fn::If:
        - "TemplateEnabled"
        -
          Fn::GetAtt:
            - "CookieSigningEdgeFunction"
            - "VersionArn"
        - ""
  CloudFrontKeyGroupId:
    Description: "CloudFront Key Group ID for signed cookies."
    Value:
      Fn::If:
        - "TemplateEnabled"
        -
          Fn::GetAtt:
            - "CloudFrontSigningKeyGroup"
            - "KeyGroupId"
        - ""
  ResolvedKmsKeyId:
    Description: "Resolved KMS key ID."
    Value:
      Fn::If:
        - "TemplateEnabled"
        -
          Fn::If:
            - "ManageSigningKeyMaterial"
            -
              Fn::GetAtt:
                - "SigningKeyMaterial"
                - "KmsKeyId"
            -
              Ref: "KmsKeyId"
        - ""
  PublicKeyParameterName:
    Description: "SSM parameter name that stores the CloudFront public key content."
    Value:
      Fn::If:
        - "TemplateEnabled"
        -
          Fn::If:
            - "ManageSigningKeyMaterial"
            -
              Fn::GetAtt:
                - "SigningKeyMaterial"
                - "PublicKeyParameterName"
            - ""
        - ""
  NoCachePolicyId:
    Description: "CloudFront Response Headers Policy ID."
    Value:
      Fn::If:
        - "TemplateEnabled"
        -
          Fn::GetAtt:
            - "NoCachePolicy"
            - "ResponseHeadersPolicyId"
        - ""
  Route53HostedZoneId:
    Description: "Route53 Hosted Zone ID for the domain."
    Value:
      Fn::GetAtt:
        - "HostedZoneLookup"
        - "HostedZoneId"
    Condition: "OutputRoute53HostedZoneIdTemplateEnabledCondition"
  SetupInstructions:
    Description: "Next steps to complete the setup."
    Value:
      Fn::If:
        - "TemplateEnabled"
        -
          Fn::Sub: "1. Upload your static WordPress files to S3 bucket: ${StaticSiteBucket}/${S3WWWRoot}\n2. Include custom error pages (if configured): ${NotFoundPagePath} and ${ForbiddenPagePath}\n3. DNS Configuration: Check CreateDNSRecords parameter (${CreateDNSRecords})\n4. Configure Cognito User Pool and App Clients for JWT authentication\n5. Test cookie issuance via main domain: https://${DomainName}/issue-cookie?action=signin\n6. Verify protected paths redirect unauthenticated users to ${SigninPagePath}\n7. Test error pages by accessing non-existent URLs\n8. If weekly refresh is enabled, confirm config.enc and lic.jws appear under ${S3WWWRoot}/smartcloud-wpsuiteio/\n\nS3 Bucket: ${StaticSiteBucket}\nS3 WWWRoot Prefix: ${S3WWWRoot}\nCloudFront Domain: ${CloudFrontDistribution.DomainName}\nCookie Endpoint: https://${DomainName}/issue-cookie\nAuthentication: JWT Bearer token required for cookie issuance"
        - ""
  SiteKeyParameterName:
    Description: "SSM SecureString parameter that stores the WP Suite site key."
    Value:
      Fn::Sub: "/${AppName}/site-guardian/site-key"
    Condition: "OutputSiteKeyParameterNameTemplateEnabledCondition"
  LicenseRefreshFunctionArn:
    Description: "Lambda ARN of the scheduled WP Suite license refresher."
    Value:
      Fn::GetAtt:
        - "LicenseRefreshFunction"
        - "Arn"
    Condition: "OutputLicenseRefreshFunctionArnTemplateEnabledCondition"
  MonitoringDashboardUrl:
    Description: "CloudWatch Dashboard URL for monitoring."
    Value:
      Fn::Sub: "https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=${AppName}-monitoring"
    Condition: "OutputMonitoringDashboardUrlTemplateEnabledCondition"
