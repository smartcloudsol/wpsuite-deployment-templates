      - "CloudFrontDistribution"
    Condition: "TemplateEnabled"
  StaticSiteBucketPolicy:
    Type: "AWS::S3::BucketPolicy"
    Properties:
      Bucket:
        Ref: "StaticSiteBucket"
      PolicyDocument:
        Statement:
          -
            Effect: "Allow"
            Principal:
              Service: "cloudfront.amazonaws.com"
            Action:
              - "s3:GetObject"
              - "s3:ListBucket"
            Resource:
              -
                Fn::Sub: "arn:aws:s3:::${StaticSiteBucket}"
              -
                Fn::Sub: "arn:aws:s3:::${StaticSiteBucket}/*"
            Condition:
              StringEquals:
                AWS:SourceArn:
                  Fn::Sub: "arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}"
          -
            Effect: "Allow"
            Principal:
              Service: "delivery.logs.amazonaws.com"
            Action:
              - "s3:PutObject"
            Resource:
              Fn::Sub: "arn:aws:s3:::${StaticSiteBucket}/cloudfront-logs/*"
            Condition:
              StringEquals:
                s3:x-amz-acl: "bucket-owner-full-control"
          -
            Effect: "Allow"
            Principal:
              Service: "delivery.logs.amazonaws.com"
            Action:
              - "s3:GetBucketAcl"
            Resource:
              Fn::Sub: "arn:aws:s3:::${StaticSiteBucket}"
    Condition: "TemplateEnabled"
  StaticSiteBucketCleaner:
    Type: "AWS::CloudFormation::CustomResource"
    Properties:
      ServiceToken:
        Fn::GetAtt:
          - "CloudFrontResourceManager"
          - "Arn"
      ResourceType: "BucketCleaner"
      BucketName:
        Ref: "StaticSiteBucket"
    Condition: "TemplateEnabled"
  LicenseRefreshFunctionRole:
    Type: "AWS::IAM::Role"
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          -
            Effect: "Allow"
            Principal:
              Service: "lambda.amazonaws.com"
            Action: "sts:AssumeRole"
      Policies:
        -
          PolicyName: "LicenseRefreshFunctionRolePolicy"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              -
                Effect: "Allow"
                Action:
                  - "logs:CreateLogGroup"
                  - "logs:CreateLogStream"
                  - "logs:PutLogEvents"
                Resource: "*"
              -
                Effect: "Allow"
                Action:
                  - "s3:PutObject"
                Resource:
                  Fn::Sub: "arn:${AWS::Partition}:s3:::${StaticSiteBucket}/${S3WWWRoot}/smartcloud-wpsuiteio/*"
              -
                Effect: "Allow"
                Action:
                  - "ssm:GetParameter"
                Resource:
                  Fn::Sub: "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${AppName}/site-guardian/site-key"
      Tags:
        -
          Key: "aws-apn-id"
          Value:
            Ref: "PrmTagValue"
    Condition: "LicenseRefreshFunctionRoleTemplateEnabledCondition"
  LicenseRefreshFunction:
    Type: "AWS::Lambda::Function"
    Properties:
      Code:
        S3Bucket:
          Ref: "ArtifactBucketName"
        S3Key:
          Fn::Join:
            - ""
            -
              -
                Ref: "ArtifactRootPrefix"
              - "wpsuite-site-guardian/functions/license-refresh.zip"
      Handler: "license_refresher.lambda_handler"
      Description: "Refreshes config.enc and lic.jws in the site bucket from the WP Suite API."
      Runtime: "python3.12"
      Timeout: 30
      MemorySize: 256
      Role:
        Fn::GetAtt:
          - "LicenseRefreshFunctionRole"
          - "Arn"
      FunctionName:
        Fn::Sub: "${AppName}-license-refresh"
      Environment:
        Variables:
          WPSUITE_MARKETPLACE_DEPLOYMENT_PRODUCT_CODE: "5d8wq5hg1d54kb933ntenntiu"
          AWS_SDK_UA_APP_ID: "APN_1.1/pc_5d8wq5hg1d54kb933ntenntiu$"
          SITE_BUCKET_NAME:
            Ref: "StaticSiteBucket"
          SITE_WWWROOT:
            Ref: "S3WWWRoot"
          WPSUITE_ACCOUNT_ID:
            Ref: "WpsuiteAccountId"
          WPSUITE_SITE_ID:
            Ref: "WpsuiteSiteId"
          WPSUITE_API_BASE_URL:
            Ref: "WpsuiteApiBaseUrl"
          SITE_KEY_PARAMETER_NAME:
            Fn::Sub: "/${AppName}/site-guardian/site-key"
      Tags:
        -
          Key: "aws-apn-id"
          Value:
            Ref: "PrmTagValue"
    Condition: "LicenseRefreshFunctionTemplateEnabledCondition"
  LicenseRefreshFunctionLogGroup:
    Type: "AWS::Logs::LogGroup"
