AWSTemplateFormatVersion: "2010-09-09"
Description: "WP Suite Site Guardian nested template for Marketplace Deployment Access"
Parameters:
  PrmTagValue:
    Type: "String"
    Default: "pc:5d8wq5hg1d54kb933ntenntiu"
    AllowedPattern: "^pc:[a-z0-9]+$"
    Description: "AWS Partner Revenue Measurement tag value for WP Suite Deployment Access resources."
  Enabled:
    Type: "String"
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    Description: "Create Static Site Guardian resources in this nested stack."
  TemplateVersion:
    Type: "String"
    Default: "v1.0.71"
    Description: "Immutable WP Suite deployment template version."
  ArtifactRootPrefix:
    Type: "String"
    Description: "Buyer-owned S3 prefix containing staged WP Suite artifacts."
  ArtifactBucketName:
    Type: "String"
    Default: "wpsuite-artifacts"
    Description: "S3 bucket that stores the published deployment artifacts for this application."
  BackupSelectionTagValue:
    Type: "String"
    Default: ""
    Description: "Deployment-scoped tag value used by the optional WP Suite DR backup plan."
  AppName:
    Type: "String"
    Default: "wpsuite-site-guardian"
    Description: "Short application name used for generated resource names and SSM parameter paths."
  DomainName:
    Type: "String"
    Default: "example.com"
    Description: "Custom domain for CloudFront distribution."
  CertificateArn:
    Type: "String"
    Description: "ARN of the SSL certificate in ACM us-east-1."
  CognitoUserPoolId:
    Type: "String"
    Default: ""
    Description: "Cognito User Pool ID for JWT issuer validation."
  CognitoAppClientIds:
    Type: "CommaDelimitedList"
    Default: ""
    Description: "Comma-separated list of Cognito App Client IDs for JWT audience validation."
  ProtectedPaths:
    Type: "CommaDelimitedList"
    Default: "/restricted"
    Description: "List of paths to protect with signed cookies."
  PublicCacheMode:
    Type: "String"
    Default: "fixed-7d"
    AllowedValues:
      - "fixed-1d"
      - "fixed-7d"
      - "fixed-30d"
      - "managed-optimized"
    Description: "CloudFront edge cache mode for the public default cache behavior."
  ProtectedPathGroupMap:
    Type: "String"
    Default: "{}"
    Description: "Optional JSON object mapping protected paths to allowed groups."
  AdditionalOrigins:
    Type: "String"
    Default: "-~-~-~-~-~-~-~-|-~-~-~-~-~-~-~-|-~-~-~-~-~-~-~-|-~-~-~-~-~-~-~-|-~-~-~-~-~-~-~-"
    AllowedPattern: "^[^|~]*(?:~[^|~]*){7}(?:\\|[^|~]*(?:~[^|~]*){7}){4}$"
    Description: "Five packed optional CloudFront origin records using pipe record and tilde field delimiters."
    MaxLength: 4096
  AdditionalCacheBehaviors:
    Type: "String"
    Default: "-~-~-~-~-~-~-~-|-~-~-~-~-~-~-~-|-~-~-~-~-~-~-~-|-~-~-~-~-~-~-~-|-~-~-~-~-~-~-~-|-~-~-~-~-~-~-~-|-~-~-~-~-~-~-~-|-~-~-~-~-~-~-~-|-~-~-~-~-~-~-~-|-~-~-~-~-~-~-~-"
    AllowedPattern: "^(?!(?:/issue-cookie|/restricted|/smartcloud-wpsuiteio))[^|~]*(?:~[^|~]*){7}(?:\\|(?!(?:/issue-cookie|/restricted|/smartcloud-wpsuiteio))[^|~]*(?:~[^|~]*){7}){9}$"
    Description: "Ten packed optional ordered CloudFront cache behavior records using pipe record and tilde field delimiters."
    MaxLength: 4096
  AdditionalFunctionAssociations:
    Type: "String"
    Default: "-~-|-~-|-~-|-~-|-~-|-~-|-~-|-~-|-~-|-~-"
    AllowedPattern: "^[^|~]*(?:~[^|~]*){1}(?:\\|[^|~]*(?:~[^|~]*){1}){9}$"
    Description: "Ten packed CloudFront Function association records aligned with the additional cache behavior slots."
    MaxLength: 4096
  AdditionalViewerLambdaAssociations:
    Type: "String"
    Default: "-~-~-|-~-~-|-~-~-|-~-~-|-~-~-|-~-~-|-~-~-|-~-~-|-~-~-|-~-~-"
    AllowedPattern: "^[^|~]*(?:~[^|~]*){2}(?:\\|[^|~]*(?:~[^|~]*){2}){9}$"
    Description: "Ten packed viewer Lambda@Edge association records aligned with the additional cache behavior slots."
    MaxLength: 4096
  AdditionalOriginLambdaAssociations:
    Type: "String"
    Default: "-~-~-|-~-~-|-~-~-|-~-~-|-~-~-|-~-~-|-~-~-|-~-~-|-~-~-|-~-~-"
    AllowedPattern: "^[^|~]*(?:~[^|~]*){2}(?:\\|[^|~]*(?:~[^|~]*){2}){9}$"
    Description: "Ten packed origin Lambda@Edge association records aligned with the additional cache behavior slots."
    MaxLength: 4096
  SigninPagePath:
    Type: "String"
    Default: "/signin"
    Description: "Path to redirect unauthenticated users for sign-in."
  CookieExpirationSeconds:
    Type: "Number"
    Default: 2592000
    Description: "Signed-cookie lifetime in whole seconds, from 1 hour through 3,650 days."
    MaxValue: 315360000
    MinValue: 3600
  ManageSigningKeys:
    Type: "String"
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    Description: "Automatically manage the CloudFront public key and asymmetric KMS signing key."
  PublicKeyContent:
    Type: "String"
    Default: ""
    Description: "Manual mode only. Base64 encoded ECDSA P-256 public key content."
  KmsKeyId:
    Type: "String"
    Default: ""
    Description: "Manual mode only. KMS asymmetric ECC_NIST_P256 signing key ID."
  EnableCloudFrontWAF:
    Type: "String"
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: "Enable AWS WAF protection for the Static Guardian CloudFront distribution."
  EnableDetailedLogging:
    Type: "String"
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: "Enable detailed CloudWatch logging for troubleshooting."
  LogRetentionDays:
    Type: "Number"
    Default: 14
    Description: "Number of days to retain CloudWatch logs."
  S3BucketName:
    Type: "String"
    Default: ""
    Description: "Custom name for the S3 bucket hosting static files."
  S3WWWRoot:
    Type: "String"
    Default: "wwwroot"
    Description: "S3 wwwroot prefix without leading/trailing slash."
  NotFoundPagePath:
    Type: "String"
    Default: ""
    Description: "Optional path to custom 404 error page relative to S3WWWRoot."
  ForbiddenPagePath:
    Type: "String"
    Default: ""
    Description: "Optional path to custom 403 error page relative to S3WWWRoot."
  CreateDNSRecords:
    Type: "String"
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    Description: "Create Route53 DNS records for the domains."
  WpsuiteAccountId:
    Type: "String"
    Default: ""
    Description: "Optional WP Suite account ID used by the weekly config refresh Lambda."
  WpsuiteSiteId:
    Type: "String"
    Default: ""
    Description: "Optional WP Suite site ID used by the weekly config refresh Lambda."
  WpsuiteSiteKey:
    Type: "String"
    Default: ""
    Description: "Optional WP Suite site key stored as a SecureString in SSM when weekly refresh is enabled."
    NoEcho: true
  WpsuiteApiBaseUrl:
    Type: "String"
    Default: "https://api.wpsuite.io"
    Description: "Base URL for WP Suite license refresh requests."
  LicenseRefreshScheduleExpression:
    Type: "String"
    Default: "rate(7 days)"
    Description: "EventBridge schedule expression for refreshing config.enc and lic.jws."
Mappings:
  WpSuiteMarketplace:
    DeploymentAccess:
      ProductCode: "5d8wq5hg1d54kb933ntenntiu"
Conditions:
  TemplateEnabled:
    Fn::Equals:
      -
        Ref: "Enabled"
      - "true"
  EnableLogging:
    Fn::Equals:
      -
        Ref: "EnableDetailedLogging"
      - "true"
  CondEnableCloudFrontWAF:
    Fn::Equals:
      -
        Ref: "EnableCloudFrontWAF"
      - "true"
  UseCustomBucketName:
    Fn::Not:
      -
        Fn::Equals:
          -
            Ref: "S3BucketName"
          - ""
  CreateDNS:
    Fn::Equals:
      -
        Ref: "CreateDNSRecords"
      - "true"
  ManageSigningKeyMaterial:
    Fn::Equals:
      -
        Ref: "ManageSigningKeys"
      - "true"
  HasNotFoundPage:
    Fn::Not:
      -
        Fn::Equals:
          -
            Ref: "NotFoundPagePath"
          - ""
  HasForbiddenPage:
    Fn::Not:
      -
        Fn::Equals:
          -
            Ref: "ForbiddenPagePath"
          - ""
  HasWpsuiteAccountId:
