            -
              Ref: "AWS::NoValue"
        Logging:
          Fn::If:
            - "EnableLogging"
            -
              Bucket:
                Fn::GetAtt:
                  - "StaticSiteBucket"
                  - "DomainName"
              Prefix: "cloudfront-logs/"
              IncludeCookies: true
            -
              Ref: "AWS::NoValue"
        CustomErrorResponses:
          Fn::If:
            - "HasNotFoundPage"
            -
              Fn::If:
                - "HasForbiddenPage"
                -
                  -
                    ErrorCode: 404
                    ResponseCode: 404
                    ResponsePagePath:
                      Fn::Sub: "/${S3WWWRoot}${NotFoundPagePath}"
                    ErrorCachingMinTTL: 300
                  -
                    ErrorCode: 403
                    ResponseCode: 403
                    ResponsePagePath:
                      Fn::Sub: "/${S3WWWRoot}${ForbiddenPagePath}"
                    ErrorCachingMinTTL: 300
                -
                  -
                    ErrorCode: 404
                    ResponseCode: 404
                    ResponsePagePath:
                      Fn::Sub: "/${S3WWWRoot}${NotFoundPagePath}"
                    ErrorCachingMinTTL: 300
            -
              Fn::If:
                - "HasForbiddenPage"
                -
