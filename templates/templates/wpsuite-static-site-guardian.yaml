Resources:
  StaticSiteBucket:
    Type: "AWS::S3::Bucket"
    Properties:
      BucketName:
        Fn::If:
          - "UseCustomBucketName"
          -
            Ref: "S3BucketName"
          -
            Ref: "AWS::NoValue"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          -
            ObjectOwnership: "BucketOwnerPreferred"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          -
            ServerSideEncryptionByDefault:
              SSEAlgorithm: "AES256"
      VersioningConfiguration:
        Status: "Enabled"
      Tags:
        -
          Key: "wpsuite:dr-backup"
          Value: "true"
        -
          Key: "wpsuite:backup-scope"
          Value:
            Ref: "BackupSelectionTagValue"
        -
          Key: "aws-apn-id"
          Value:
            Ref: "PrmTagValue"
    Condition: "TemplateEnabled"
  CloudFrontSigningKmsKey:
    Type: "AWS::KMS::Key"
    Properties:
      Description:
        Fn::Sub: "${AppName} Site Guardian CloudFront signed-cookie signing key"
      KeySpec: "ECC_NIST_P256"
      KeyUsage: "SIGN_VERIFY"
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          -
            Sid: "EnableRootPermissions"
            Effect: "Allow"
            Principal:
              AWS:
                Fn::Sub: "arn:${AWS::Partition}:iam::${AWS::AccountId}:root"
            Action:
              - "kms:CancelKeyDeletion"
              - "kms:CreateAlias"
              - "kms:CreateGrant"
              - "kms:Decrypt"
              - "kms:DeleteAlias"
              - "kms:DescribeKey"
              - "kms:DisableKey"
              - "kms:DisableKeyRotation"
              - "kms:EnableKey"
              - "kms:EnableKeyRotation"
              - "kms:Encrypt"
              - "kms:GenerateDataKey"
              - "kms:GenerateDataKeyPair"
              - "kms:GenerateDataKeyPairWithoutPlaintext"
              - "kms:GenerateDataKeyWithoutPlaintext"
              - "kms:GetKeyPolicy"
              - "kms:GetKeyRotationStatus"
              - "kms:GetPublicKey"
              - "kms:ListGrants"
              - "kms:ListResourceTags"
              - "kms:PutKeyPolicy"
              - "kms:ReEncryptFrom"
              - "kms:ReEncryptTo"
              - "kms:RetireGrant"
              - "kms:RevokeGrant"
              - "kms:ScheduleKeyDeletion"
              - "kms:Sign"
              - "kms:TagResource"
              - "kms:UntagResource"
              - "kms:UpdateAlias"
              - "kms:UpdateKeyDescription"
              - "kms:Verify"
            Resource: "*"
      Tags:
        -
          Key: "aws-apn-id"
          Value:
            Ref: "PrmTagValue"
    Condition: "CloudFrontSigningKmsKeyTemplateEnabledCondition"
  CloudFrontResourceManagerRole:
    Type: "AWS::IAM::Role"
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          -
            Effect: "Allow"
            Principal:
              Service: "lambda.amazonaws.com"
            Action: "sts:AssumeRole"
      Policies:
        -
          PolicyName: "CloudFrontResourceManagerRolePolicy"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              -
                Effect: "Allow"
                Action:
                  - "logs:CreateLogGroup"
                  - "logs:CreateLogStream"
                  - "logs:PutLogEvents"
                Resource: "*"
              -
                Effect: "Allow"
                Action:
                  - "cloudfront:CreatePublicKey"
                  - "cloudfront:DeletePublicKey"
                  - "cloudfront:GetPublicKey"
                  - "cloudfront:CreateKeyGroup"
                  - "cloudfront:DeleteKeyGroup"
                  - "cloudfront:GetKeyGroup"
                  - "cloudfront:CreateFunction"
                  - "cloudfront:UpdateFunction"
                  - "cloudfront:DeleteFunction"
                  - "cloudfront:DescribeFunction"
                  - "cloudfront:PublishFunction"
                  - "cloudfront:CreateOriginAccessControl"
                  - "cloudfront:DeleteOriginAccessControl"
                  - "cloudfront:GetOriginAccessControl"
                  - "cloudfront:CreateResponseHeadersPolicy"
                  - "cloudfront:UpdateResponseHeadersPolicy"
                  - "cloudfront:DeleteResponseHeadersPolicy"
                  - "cloudfront:GetResponseHeadersPolicy"
                  - "cloudfront:GetDistribution"
                  - "cloudfront:GetDistributionConfig"
                Resource: "*"
              -
                Effect: "Allow"
                Action:
                  - "cloudfront:UpdateDistribution"
                Resource:
                  Fn::Sub: "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/*"
              -
                Effect: "Allow"
                Action:
                  - "wafv2:CreateWebACL"
                  - "wafv2:GetWebACL"
                  - "wafv2:ListWebACLs"
                  - "wafv2:UpdateWebACL"
                  - "wafv2:DeleteWebACL"
                  - "wafv2:TagResource"
                  - "wafv2:UntagResource"
                Resource: "*"
              -
                Effect: "Allow"
                Action:
                  - "route53:ListHostedZones"
                Resource: "*"
              -
                Effect: "Allow"
                Action:
                  - "lambda:CreateFunction"
                  - "lambda:DeleteFunction"
                  - "lambda:DeleteAlias"
                  - "lambda:GetFunction"
