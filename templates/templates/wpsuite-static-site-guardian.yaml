            Ref: "WpsuiteSiteKey"
          - ""
  EnableWeeklyLicenseRefresh:
    Fn::And:
      -
        Condition: "HasWpsuiteAccountId"
      -
        Condition: "HasWpsuiteSiteId"
      -
        Condition: "HasWpsuiteSiteKey"
  UseManagedPublicCachePolicy:
    Fn::Equals:
      -
        Ref: "PublicCacheMode"
      - "managed-optimized"
  UseFixedPublicCachePolicy:
    Fn::Not:
      -
        Condition: "UseManagedPublicCachePolicy"
  UseOneDayPublicCache:
    Fn::Equals:
      -
        Ref: "PublicCacheMode"
